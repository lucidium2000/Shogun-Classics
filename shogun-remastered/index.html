<style>
:root { --bg: #050303; --panel: #0d0807; --line: #3a1a14; --accent: #a3201d; --brass: #c9a24b; --fg: #ebe3d3; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); box-sizing: border-box; }
#screen { position: relative; width: min(100%, calc((100vh - 0px) * 16 / 9)); width: min(100%, calc(100dvh * 16 / 9)); aspect-ratio: 16 / 9; max-width: 100%; }
#cv { display: block; width: 100%; height: 100%; background: #000; outline: none; image-rendering: auto; }
#touch { display: none; }
body.touch #touch { display: flex; }
.pad { position: relative; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.06), rgba(255,255,255,0.02) 60%, rgba(0,0,0,0.25)); border: 2px solid rgba(201,162,75,0.45); touch-action: none; flex: none; }
.pad::before, .pad::after { content: ""; position: absolute; background: rgba(201,162,75,0.18); }
.pad::before { left: 50%; top: 14%; bottom: 14%; width: 2px; margin-left: -1px; }
.pad::after { top: 50%; left: 14%; right: 14%; height: 2px; margin-top: -1px; }
#knob, .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #5a4a3a, #1a1210); border: 2px solid rgba(201,162,75,0.7); pointer-events: none; z-index: 1; }
.btns { display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; gap: 12px; align-items: center; flex: none; }
.b { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font: 700 26px/1 'Barlow Condensed', 'Arial Narrow', sans-serif; letter-spacing: 1px; color: #fff; touch-action: none; border: 2px solid rgba(255,255,255,0.35); }
#btnP, #btnP2 { background: radial-gradient(circle at 40% 35%, #d9322b, #7a0f0b); grid-row: 1 / 3; grid-column: 2; width: 98px; height: 98px; font-size: 30px; }
#btnSP, #btnSP2 { background: radial-gradient(circle at 40% 35%, #e8a33a, #7a4b0b); width: 64px; height: 64px; font-size: 20px; }
#btnPause { background: rgba(255,255,255,0.08); width: 46px; height: 46px; font-size: 16px; border-color: rgba(255,255,255,0.2); }
.b.on { filter: brightness(1.5); transform: scale(0.95); }
#btnMenu { display: none; position: fixed; z-index: 4; top: max(8px, env(safe-area-inset-top, 0px)); left: max(8px, env(safe-area-inset-left, 0px));
  font: 700 14px/1 'Barlow Condensed', 'Arial Narrow', sans-serif; letter-spacing: 2px; color: rgba(235,227,211,0.75); text-decoration: none;
  background: rgba(0,0,0,0.45); border: 1px solid rgba(201,162,75,0.35); border-radius: 6px; padding: 7px 10px 6px; }
body.front #btnMenu { display: block; }
#btnMenu:hover, #btnMenu:focus-visible { color: #fff; border-color: var(--brass); }
/* two players on one phone: P1 on the left, P2 mirrored on the right */
.p2grp { display: none; }
.p1grp { display: contents; }
.who { position: absolute; top: -18px; left: 0; right: 0; text-align: center; font: 700 13px/1 'Barlow Condensed', 'Arial Narrow', sans-serif; letter-spacing: 2px; color: var(--brass); display: none; }
body.touch.two .who { display: block; }
body.touch.two .p2grp { display: flex; gap: 10px; align-items: flex-end; margin-left: auto; position: relative; }
body.touch.two #touch > .p1grp { display: flex; gap: 10px; align-items: flex-end; position: relative; }
body.touch.two .tip { display: none !important; }
body.touch.two .pad { width: 112px; height: 112px; }
body.touch.two .knob, body.touch.two #knob { width: 44px; height: 44px; margin: -22px 0 0 -22px; }
body.touch.two #btnP, body.touch.two #btnP2 { width: 66px; height: 66px; font-size: 24px; }
body.touch.two #btnSP, body.touch.two #btnSP2 { width: 48px; height: 48px; font-size: 16px; }
body.touch.two #btnPause { width: 40px; height: 40px; }
@media (orientation: portrait) {
  body.touch.two #touch { flex-direction: column; flex-wrap: nowrap; align-items: stretch; justify-content: space-around; gap: 22px; }
  body.touch.two #touch > .p1grp { justify-content: space-between; }
  body.touch.two .p2grp { margin-left: 0; justify-content: space-between; flex-direction: row-reverse; }
}
/* portrait phone: controls live under the screen */
@media (orientation: portrait) {
  body.touch #app { justify-content: flex-start; padding-top: max(10px, env(safe-area-inset-top, 0px)); }
  body.touch #screen { width: 100%; }
  body.touch #touch { width: 100%; flex: 1; align-items: flex-end; flex-wrap: wrap; align-content: space-between; justify-content: space-between; padding: 12px max(22px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px)); box-sizing: border-box; background: linear-gradient(var(--panel), #000); border-top: 1px solid var(--line); }
}
/* landscape phone: controls float over the screen corners */
@media (orientation: landscape) {
  body.touch #touch { position: fixed; inset: auto 0 0 0; justify-content: space-between; align-items: flex-end; padding: 0 max(18px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); pointer-events: none; opacity: 0.72; }
  body.touch #touch > * { pointer-events: auto; }
  body.touch .pad { width: 130px; height: 130px; }
  body.touch .b { width: 70px; height: 70px; }
  body.touch #btnP { width: 84px; height: 84px; }
  body.touch #btnSP { width: 56px; height: 56px; }
}
  .tip { display: none; }
@media (orientation: portrait) { body.touch .tip { display: block; width: 100%; margin: 6px 0 0; text-align: center; font: 600 15px/1.4 'Barlow Condensed', 'Arial Narrow', sans-serif; letter-spacing: 1px; color: #8c7f6c; } body.touch #touch { padding-bottom: max(40px, env(safe-area-inset-bottom, 0px)); } }
@media (prefers-reduced-motion: reduce) { .b.on { transform: none; } }
</style>
<div id="app">
  <div id="screen"><canvas id="cv" width="960" height="540" tabindex="0" aria-label="Shogun game screen"></canvas></div>
  <div id="touch" aria-label="Touch controls">
    <p class="tip">Hold back to block · down + P uppercut · up + P jump kick · SP special</p>
    <div class="p1grp">
      <span class="who">PLAYER 1</span>
      <div class="pad" id="dpad"><div id="knob"></div></div>
      <div class="btns">
        <div class="b" id="btnPause" role="button" aria-label="Pause">II</div>
        <div class="b" id="btnP" role="button" aria-label="Punch">P</div>
        <div class="b" id="btnSP" role="button" aria-label="Special move">SP</div>
      </div>
    </div>
    <div class="p2grp" aria-label="Player 2 touch controls">
      <span class="who">PLAYER 2</span>
      <div class="btns">
        <div class="b" id="btnP2" role="button" aria-label="Player 2 punch">P</div>
        <div class="b" id="btnSP2" role="button" aria-label="Player 2 special move">SP</div>
      </div>
      <div class="pad" id="dpad2"><div class="knob" id="knob2"></div></div>
    </div>
  </div>
  <a id="btnMenu" href="../" aria-label="Back to the Shogun Classics menu">&#9664; MENU</a>
</div>
<script>
// Shogun Classics - https://github.com/lucidium2000/Shogun-Classics
// Copyright (c) 1996-2026 Chris (lucidium2000) and Mystical Software. MIT License, see LICENSE.
// Created with Corbin Hildreth, Jason Rudisill, Chance Kornegay and Elijah Matthew Cash.
/* SHOGUN Remastered: procedural audio.
   Nothing is sampled. The 1996 PLAY strings are parsed and re-voiced with
   taiko, koto and shakuhachi patches, and the fight loops are generated from
   a fixed seed so each stage always has the same theme. */
const Audio = (() => {
  const A = { ctx: null, on: true, voice: true, musicVol: 0.32, sfxVol: 0.8, track: null };
  let master, musicBus, sfxBus, verb, noiseBuf;

  A.init = function () {
    if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const ctx = A.ctx = new C();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -12; comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.2;
    master = ctx.createGain(); master.gain.value = A.on ? 0.9 : 0;
    comp.connect(master); master.connect(ctx.destination);
    musicBus = ctx.createGain(); musicBus.gain.value = A.musicVol; musicBus.connect(comp);
    sfxBus = ctx.createGain(); sfxBus.gain.value = A.sfxVol; sfxBus.connect(comp);
    // small hall: generated impulse response
    verb = ctx.createConvolver();
    const len = ctx.sampleRate * 2.2, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
    }
    verb.buffer = ir;
    const vg = ctx.createGain(); vg.gain.value = 0.35; verb.connect(vg); vg.connect(comp);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  };

  A.setOn = function (on) {
    A.on = on;
    if (master) master.gain.setTargetAtTime(on ? 0.9 : 0, A.ctx.currentTime, 0.05);
    if (!on && window.speechSynthesis) speechSynthesis.cancel();
  };

  const now = () => A.ctx.currentTime;
  function noise(t, dur, dest, type, f0, f1, q, g0, attack) {
    const ctx = A.ctx, s = ctx.createBufferSource(); s.buffer = noiseBuf;
    s.playbackRate.value = 0.8 + Math.random() * 0.4;
    const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q || 1;
    f.frequency.setValueAtTime(f0, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(g0, t + (attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest);
    s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
    return g;
  }
  function osc(t, type, f0, f1, dur, dest, g0, attack, glide) {
    const ctx = A.ctx, o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + (glide || dur));
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(g0, t + (attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
    return { o, g };
  }
  function send(node, amt) { const g = A.ctx.createGain(); g.gain.value = amt; node.connect(g); g.connect(verb); }

  /* ------------------------------------------------------------ voices */
  const V = {};
  V.taiko = (t, g, dest, hz) => {
    hz = hz || 70;
    osc(t, 'sine', hz * 2.2, hz, 0.55, dest, g, 0.003, 0.09);
    const n = noise(t, 0.12, dest, 'lowpass', 900, 200, 1, g * 0.5);
    send(n, 0.4);
  };
  V.rim = (t, g, dest) => { noise(t, 0.05, dest, 'bandpass', 2600, 0, 4, g); osc(t, 'square', 820, 0, 0.03, dest, g * 0.15); };
  V.shaker = (t, g, dest) => noise(t, 0.05, dest, 'highpass', 7000, 0, 1, g);
  V.koto = (t, f, dur, g, dest) => {
    const ctx = A.ctx;
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
    o1.type = 'triangle'; o2.type = 'sawtooth'; o1.frequency.value = f; o2.frequency.value = f * 1.003;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 2;
    lp.frequency.setValueAtTime(f * 9, t); lp.frequency.exponentialRampToValueAtTime(f * 1.4, t + 0.35);
    const gg = ctx.createGain();
    gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(g, t + 0.004);
    gg.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.4, dur * 1.6));
    const m2 = ctx.createGain(); m2.gain.value = 0.35;
    o1.connect(lp); o2.connect(m2); m2.connect(lp); lp.connect(gg); gg.connect(dest); send(gg, 0.5);
    o1.start(t); o2.start(t); o1.stop(t + dur * 1.6 + 0.5); o2.stop(t + dur * 1.6 + 0.5);
  };
  V.flute = (t, f, dur, g, dest) => {
    const ctx = A.ctx, o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 5.2; lg.gain.value = f * 0.012;
    lfo.connect(lg); lg.connect(o.frequency);
    const o3 = ctx.createOscillator(); o3.type = 'triangle'; o3.frequency.value = f * 2; const g3 = ctx.createGain(); g3.gain.value = 0.12;
    o3.connect(g3);
    const gg = ctx.createGain();
    gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(g, t + 0.06);
    gg.gain.setValueAtTime(g * 0.85, t + Math.max(0.07, dur - 0.08)); gg.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.12);
    o.connect(gg); g3.connect(gg); gg.connect(dest); send(gg, 0.9);
    const b = noise(t, dur + 0.1, dest, 'bandpass', f * 2, 0, 3, g * 0.18, 0.05);
    [o, lfo, o3].forEach(x => { x.start(t); x.stop(t + dur + 0.2); });
    return b;
  };
  V.bass = (t, f, dur, g, dest) => {
    const ctx = A.ctx, o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(f * 6, t); lp.frequency.exponentialRampToValueAtTime(f * 1.5, t + dur);
    const s = ctx.createOscillator(); s.type = 'sine'; s.frequency.value = f / 2;
    const gs = ctx.createGain(); gs.gain.value = 0.7;
    const gg = ctx.createGain(); gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(g, t + 0.01); gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(lp); s.connect(gs); gs.connect(lp); lp.connect(gg); gg.connect(dest);
    o.start(t); s.start(t); o.stop(t + dur + 0.05); s.stop(t + dur + 0.05);
  };
  V.drone = (t, f, dur, g, dest) => {
    const ctx = A.ctx, gg = ctx.createGain();
    gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(g, t + dur * 0.3); gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
    [1, 1.5, 2.004].forEach((m, i) => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f * m * (1 + (i - 1) * 0.002); o.connect(lp); o.start(t); o.stop(t + dur + 0.05); });
    lp.connect(gg); gg.connect(dest); send(gg, 0.8);
  };
  V.brass = (t, f, dur, g, dest) => {
    const ctx = A.ctx, lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(f * 1.5, t); lp.frequency.exponentialRampToValueAtTime(f * 6, t + 0.08); lp.frequency.exponentialRampToValueAtTime(f * 2.5, t + dur);
    const gg = ctx.createGain(); gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(g, t + 0.03);
    gg.gain.setValueAtTime(g * 0.8, t + Math.max(0.04, dur - 0.05)); gg.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.15);
    [0.997, 1.003, 0.5].forEach(m => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f * m; o.connect(lp); o.start(t); o.stop(t + dur + 0.2); });
    lp.connect(gg); gg.connect(dest); send(gg, 0.6);
  };
  V.gong = (t, g, dest) => {
    [1, 1.41, 2.27, 2.98, 4.1].forEach((m, i) => { const x = osc(t, 'sine', 88 * m, 0, 3.5 - i * 0.5, dest, g / (i + 1.5), 0.01); send(x.g, 0.7); });
    noise(t, 0.6, dest, 'bandpass', 500, 300, 1, g * 0.3);
  };

  /* ------------------------------------------------- QBasic PLAY parser */
  // O3 C is middle C, as in QBasic. Returns [{f, dur, oct}] with f = 0 for rests.
  A.parsePlay = function (s, state) {
    const st = state || { T: 120, O: 4, L: 4 };
    const out = []; s = s.toUpperCase(); let i = 0;
    const num = () => { let m = ''; while (i < s.length && /[0-9]/.test(s[i])) m += s[i++]; return m ? +m : null; };
    const semi = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
    while (i < s.length) {
      const c = s[i++];
      if (c === 'T') { const n = num(); if (n) st.T = n; }
      else if (c === 'O') { const n = num(); if (n !== null) st.O = n; }
      else if (c === 'L') { const n = num(); if (n) st.L = n; }
      else if (c === '<') st.O = Math.max(0, st.O - 1);
      else if (c === '>') st.O = Math.min(6, st.O + 1);
      else if (c === 'M') i++;
      else if (c === 'P') { const n = num() || st.L; out.push({ f: 0, dur: 240 / st.T / n }); }
      else if (semi[c] !== undefined) {
        let n = semi[c];
        if (s[i] === '#' || s[i] === '+') { n++; i++; } else if (s[i] === '-') { n--; i++; }
        const len = num() || st.L; let dur = 240 / st.T / len, d = 1;
        while (s[i] === '.') { d *= 0.5; dur += 240 / st.T / len * d; i++; }
        const midi = 12 * (st.O + 1) + 12 + n; // O3 C = 60
        out.push({ f: 440 * Math.pow(2, (midi - 69) / 12), dur, oct: st.O, midi });
      }
    }
    return out;
  };

  // Re-voice a 1996 PLAY string. Octave 0/1 thumps become taiko; the rest is
  // lifted into koto or brass range so the motif reads as music.
  A.play = function (s, opt) {
    if (!A.ctx) return 0;
    opt = opt || {};
    const notes = A.parsePlay(s, { T: opt.T || 120, O: 4, L: 4 });
    let t = now() + 0.03; const dest = sfxBus; const voice = opt.voice || 'koto';
    for (const n of notes) {
      if (n.f) {
        if (n.oct <= 1 && voice !== 'pure') {
          V.taiko(t, 0.75, dest, 55 + n.midi * 0.6);
          V[voice === 'brass' ? 'brass' : 'koto'](t, n.f * (n.oct === 0 ? 8 : 4), n.dur * 0.9, 0.16, dest);
        } else V[voice === 'brass' ? 'brass' : voice === 'flute' ? 'flute' : 'koto'](t, n.f, n.dur * 0.9, 0.22, dest);
      }
      t += n.dur;
    }
    return t - now();
  };

  /* --------------------------------------------------------------- SFX */
  const S = {};
  S.punch = () => { const t = now(); noise(t, 0.09, sfxBus, 'bandpass', 1400, 400, 1.2, 0.7); osc(t, 'sine', 160, 60, 0.12, sfxBus, 0.9); };
  S.heavy = () => { const t = now(); noise(t, 0.16, sfxBus, 'lowpass', 2400, 300, 1, 0.9); osc(t, 'sine', 120, 40, 0.22, sfxBus, 1); V.taiko(t, 0.5, sfxBus, 60); };
  S.block = () => { const t = now(); osc(t, 'square', 1800, 1200, 0.07, sfxBus, 0.18); noise(t, 0.06, sfxBus, 'highpass', 3000, 0, 1, 0.4); };
  S.whoosh = (hi) => { const t = now(); noise(t, 0.16, sfxBus, 'bandpass', hi ? 1800 : 900, hi ? 4000 : 2400, 2.5, 0.35, 0.05); };
  S.slash = () => { const t = now(); noise(t, 0.2, sfxBus, 'highpass', 2500, 7000, 1.5, 0.5, 0.01); const x = osc(t + 0.02, 'sine', 3520, 3300, 0.6, sfxBus, 0.06); send(x.g, 0.6); };
  S.sliceHit = () => { const t = now(); S.slash(); noise(t, 0.2, sfxBus, 'lowpass', 1200, 200, 1, 0.8); };
  S.jump = () => { const t = now(); noise(t, 0.12, sfxBus, 'bandpass', 600, 1500, 2, 0.25, 0.03); };
  S.land = () => { const t = now(); osc(t, 'sine', 90, 40, 0.15, sfxBus, 0.6); noise(t, 0.1, sfxBus, 'lowpass', 500, 0, 1, 0.3); };
  S.fall = () => { const t = now(); osc(t, 'sine', 80, 30, 0.35, sfxBus, 1); noise(t, 0.3, sfxBus, 'lowpass', 800, 100, 1, 0.8); V.taiko(t, 0.6, sfxBus, 50); };
  S.fireball = () => {

        c.beginPath(); c.moveTo(px - wd, y + 6); c.quadraticCurveTo(px - wd * 0.5, y - 2, px, y - 16); c.quadraticCurveTo(px + wd * 0.5, y - 2, px + wd, y + 6); c.lineTo(px + wd * 0.7, y + 12); c.lineTo(px - wd * 0.7, y + 12); c.fill();
        c.fillRect(px - wd * 0.55, y + 12, wd * 1.1, 26);
      }
    });
    const wall = layer(pw(0.6), H, (c, w) => {
      // torii gate
      c.fillStyle = '#3a0e12'; const tx = 760;
      c.fillRect(tx - 120, 250, 18, 200); c.fillRect(tx + 102, 250, 18, 200);
      c.beginPath(); c.moveTo(tx - 170, 240); c.quadraticCurveTo(tx, 222, tx + 170, 240); c.lineTo(tx + 165, 256); c.quadraticCurveTo(tx, 240, tx - 165, 256); c.fill();
      c.fillRect(tx - 135, 280, 270, 12);
      // low temple wall with tiled roof
      c.fillStyle = '#2a1018'; c.fillRect(0, 372, w, 70);
      c.fillStyle = '#1a0a10'; c.beginPath(); c.moveTo(-10, 378); for (let x = 0; x < w; x += 24) { c.lineTo(x, 360); c.lineTo(x + 12, 364); } c.lineTo(w + 10, 378); c.fill();
      c.fillStyle = 'rgba(255,170,90,0.08)'; for (let x = 20; x < w; x += 90) c.fillRect(x, 392, 50, 36);
    });
    const floor = layer(ARENA, H, (c) => { stoneFloor(c, 438, ['#5b3328', '#24120f', 'rgba(20,8,6,0.45)']); });
    const lanterns = [];
    for (let i = 0; i < 5; i++) lanterns.push({ x: 120 + i * 240 + r() * 40, y: 120 + r() * 50, ph: r() * 6 });
    return {
      name: 'TEMPLE COURTYARD', light: 1, rim: '#ffc887', ambient: 'rgba(255,140,80,0.10)', music: 'fight1', wind: 0.5,
      shadow: 'rgba(30,10,8,0.55)', bloodFloor: '#5a0d0b',

        for (const L of lanterns) {
          const x = L.x - cam * 0.85, y = L.y + Math.sin(t * 1.3 + L.ph) * 3, fl = 0.8 + 0.2 * Math.sin(t * 9 + L.ph * 3) * Math.sin(t * 5.3 + L.ph);
          ctx.strokeStyle = '#140808'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, y - 18); ctx.stroke();
          const g = ctx.createRadialGradient(x, y, 2, x, y, 70); g.addColorStop(0, `rgba(255,170,80,${0.45 * fl})`); g.addColorStop(1, 'rgba(255,120,40,0)');
          ctx.fillStyle = g; ctx.fillRect(x - 70, y - 70, 140, 140);

          ctx.fillStyle = '#1a0a08'; ctx.fillRect(x - 9, y - 21, 18, 4); ctx.fillRect(x - 9, y + 17, 18, 4);

      },
      front(ctx, cam, t) {
        const g = ctx.createLinearGradient(0, H - 80, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(10,3,3,0.55)');
        ctx.fillStyle = g; ctx.fillRect(0, H - 80, W, 80);

  }

  /* -------------------------------------------- 2: bamboo grove, moonlight */
  function bamboo() {
    const r = rng(23);
    const sky = layer(W, H, (c) => {
      const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#04070f'); g.addColorStop(0.6, '#10233a'); g.addColorStop(1, '#1d3a4a');
      c.fillStyle = g; c.fillRect(0, 0, W, H);
      for (let i = 0; i < 140; i++) { c.fillStyle = `rgba(220,235,255,${0.2 + r() * 0.6})`; c.fillRect(r() * W, r() * 280, 1.4, 1.4); }
      const mg = c.createRadialGradient(230, 140, 20, 230, 140, 220); mg.addColorStop(0, 'rgba(220,235,255,0.5)'); mg.addColorStop(1, 'rgba(120,160,220,0)');
      c.fillStyle = mg; c.fillRect(0, 0, W, H);
      c.fillStyle = '#eef3ff'; c.beginPath(); c.arc(230, 140, 64, 0, 7); c.fill();
      c.fillStyle = 'rgba(160,180,210,0.35)'; c.beginPath(); c.arc(212, 128, 14, 0, 7); c.arc(255, 160, 9, 0, 7); c.arc(240, 112, 6, 0, 7); c.fill();
    });
    const hills = layer(pw(0.15), H, (c, w) => { ridge(c, w, 380, 70, 50, '#0e2030', r, 8); });
    const stalks = (n, f, col, wmin, wmax, seed) => { const rr = rng(seed), a = []; for (let i = 0; i < n; i++) a.push({ x: rr() * pw(f), w: wmin + rr() * (wmax - wmin), ph: rr() * 6, col, lean: (rr() - 0.5) * 0.08 }); return a; };
    const L1 = stalks(46, 0.3, '#16334a', 4, 8, 3), L2 = stalks(26, 0.55, '#0d2233', 8, 14, 5), L3 = stalks(5, 1.25, '#050b10', 12, 20, 9);
    const floor = layer(ARENA, H, (c) => {
      const g = c.createLinearGradient(0, 436, 0, H); g.addColorStop(0, '#1f3a32'); g.addColorStop(1, '#08130f');
      c.fillStyle = g; c.fillRect(0, 436, ARENA, H - 436);
      for (let i = 0; i < 500; i++) { const x = r() * ARENA, y = 440 + Math.pow(r(), 0.7) * 100; c.strokeStyle = `rgba(${60 + r() * 50 | 0},${110 + r() * 60 | 0},${80 + r() * 30 | 0},0.5)`; c.lineWidth = 1; c.beginPath(); c.moveTo(x, y); c.lineTo(x + (r() - 0.5) * 6, y - 4 - r() * 8); c.stroke(); }
    });
    const flies = []; for (let i = 0; i < 26; i++) flies.push({ x: r() * W, y: 200 + r() * 250, ph: r() * 6, sp: 0.3 + r() * 0.6 });
    function drawStalks(ctx, list, f, cam, t, top) {
      for (const b of list) {
        const x = b.x - cam * f, sway = Math.sin(t * 0.7 + b.ph) * 6;
        if (x < -40 || x > W + 40) continue;
        ctx.strokeStyle = b.col; ctx.lineWidth = b.w; ctx.lineCap = 'butt';
        ctx.beginPath(); ctx.moveTo(x, H); ctx.quadraticCurveTo(x + b.lean * 200, 250, x + sway + b.lean * 400, top); ctx.stroke();
        ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = b.w + 1;
        for (let y = H - 70; y > top + 30; y -= 64) { const k = (H - y) / (H - top); const xx = x + (b.lean * 400 + sway) * k * k; ctx.beginPath(); ctx.moveTo(xx - b.w / 2 - 1, y); ctx.lineTo(xx + b.w / 2 + 1, y); ctx.stroke(); }
        // leaves
        ctx.fillStyle = b.col;
        for (let y = H - 120; y > top + 40; y -= 110) {
          const k = (H - y) / (H - top), xx = x + (b.lean * 400 + sway) * k * k;
          for (const d of [-1, 1]) { ctx.beginPath(); ctx.ellipse(xx + d * (b.w + 14), y - 8, 18 + b.w * 0.6, 3.5 + b.w * 0.12, d * 0.4 + Math.sin(t + b.ph) * 0.1, 0, 7); ctx.fill(); }
        }
      }
    }
    return {
      name: 'BAMBOO GROVE', light: -1, rim: '#c6dcff', ambient: 'rgba(80,120,200,0.10)', music: 'fight2', wind: -0.3,
      shadow: 'rgba(0,8,12,0.6)', bloodFloor: '#3d0a0a',
      back(ctx, cam, t) {
        ctx.drawImage(sky, 0, 0); ctx.drawImage(hills, -cam * 0.15, 0);
        // low mist
        const mg = ctx.createLinearGradient(0, 330, 0, 450); mg.addColorStop(0, 'rgba(140,180,210,0)'); mg.addColorStop(1, 'rgba(140,180,210,0.18)'); ctx.fillStyle = mg; ctx.fillRect(0, 330, W, 120);
        drawStalks(ctx, L1, 0.3, cam, t, -20); drawStalks(ctx, L2, 0.55, cam, t, -40);
        ctx.drawImage(floor, -cam, 0);
        for (const f of flies) {
          const x = (f.x + Math.sin(t * f.sp + f.ph) * 40 - cam * 0.7 + W * 3) % W, y = f.y + Math.cos(t * f.sp * 1.3 + f.ph) * 20, a = 0.4 + 0.6 * Math.max(0, Math.sin(t * 2 + f.ph * 2));
          ctx.fillStyle = `rgba(210,255,150,${a})`; ctx.beginPath(); ctx.arc(x, y, 2, 0, 7); ctx.fill();
          ctx.fillStyle = `rgba(210,255,150,${a * 0.15})`; ctx.beginPath(); ctx.arc(x, y, 8, 0, 7); ctx.fill();
        }
      },
      front(ctx, cam, t) { ctx.globalAlpha = 0.82; drawStalks(ctx, L3, 1.25, cam, t, -60); ctx.globalAlpha = 1; },
    };
  }

  /* ----------------------------------------------- 3: Frill's shadow shrine */
  function shadow() {
    const r = rng(77);
    const sky = layer(W, H, (c) => {
      const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#020208'); g.addColorStop(0.55, '#0c0b22'); g.addColorStop(1, '#141634');
      c.fillStyle = g; c.fillRect(0, 0, W, H);
      const vg = c.createRadialGradient(W / 2, 250, 30, W / 2, 250, 420); vg.addColorStop(0, 'rgba(120,170,255,0.18)'); vg.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = vg; c.fillRect(0, 0, W, H);
    });
    const ruins = layer(pw(0.4), H, (c, w) => {
      c.fillStyle = '#07071a';
      for (let x = 60; x < w; x += 210 + r() * 80) {
        const h = 160 + r() * 160, ww = 34 + r() * 16;
        c.fillRect(x, 440 - h, ww, h);
        c.beginPath(); c.moveTo(x - 6, 440 - h); c.lineTo(x + ww * 0.4, 440 - h - 20 - r() * 30); c.lineTo(x + ww + 6, 440 - h + 8); c.fill();
        if (r() < 0.5) c.fillRect(x - 30, 440 - h + 12, ww + 60, 12);
      }
      c.fillStyle = '#0a0a20'; c.fillRect(0, 410, w, 40);
    });
    const floor = layer(ARENA, H, (c) => {
      const g = c.createLinearGradient(0, 440, 0, H); g.addColorStop(0, '#1a1d3c'); g.addColorStop(1, '#05060f');
      c.fillStyle = g; c.fillRect(0, 440, ARENA, H - 440);
      c.strokeStyle = 'rgba(140,190,255,0.08)';
      for (let i = 0; i < 6; i++) { const y = 440 + Math.pow(i / 6, 1.6) * 100; c.beginPath(); c.moveTo(0, y); c.lineTo(ARENA, y); c.stroke(); }
    });
    const ash = []; for (let i = 0; i < 60; i++) ash.push({ x: r() * W, y: r() * H, s: 0.5 + r() * 2, v: 8 + r() * 26, ph: r() * 6 });
    let flash = 0, nextBolt = 4;
    return {
      name: 'SHADOW SHRINE', light: 1, rim: '#9fdcff', ambient: 'rgba(80,120,255,0.12)', music: 'fight3', wind: 0.2,
      shadow: 'rgba(0,0,10,0.7)', bloodFloor: '#2a0610',
      update(dt) {
        nextBolt -= dt; flash = Math.max(0, flash - dt * 3);
        if (nextBolt < 0) { flash = 1; nextBolt = 5 + Math.random() * 7; if (typeof Audio !== 'undefined') Audio.sfx('thunder'); }
      },
      back(ctx, cam, t) {
        ctx.drawImage(sky, 0, 0);
        if (flash > 0) { ctx.fillStyle = `rgba(190,220,255,${flash * 0.35})`; ctx.fillRect(0, 0, W, H); }
        ctx.drawImage(ruins, -cam * 0.4, 0);
        for (let i = 0; i < 3; i++) {
          const y = 330 + i * 40, x = ((t * (12 + i * 8)) % (W * 2)) - W;
          const g = ctx.createLinearGradient(0, y - 30, 0, y + 30); g.addColorStop(0, 'rgba(120,170,255,0)'); g.addColorStop(0.5, 'rgba(120,170,255,0.07)'); g.addColorStop(1, 'rgba(120,170,255,0)');
          ctx.fillStyle = g; ctx.fillRect(0, y - 30, W, 60);
          ctx.fillStyle = 'rgba(170,210,255,0.035)'; ctx.beginPath(); ctx.ellipse(x + W / 2, y, 400, 22, 0, 0, 7); ctx.fill();
        }
        ctx.drawImage(floor, -cam, 0);
        for (const a of ash) {
          const y = ((a.y - t * a.v) % H + H) % H, x = a.x + Math.sin(t + a.ph) * 14;
          ctx.fillStyle = `rgba(190,220,255,${0.25 + 0.25 * Math.sin(t * 2 + a.ph)})`; ctx.fillRect(x, y, a.s, a.s);
        }
      },
      front(ctx, cam, t) {
        const g = ctx.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 620); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,8,0.7)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      },
      flash: () => flash,
    };
  }

  /* --------------------------------------- the spike pit, for fatalities */
  S.drawPit = function (ctx, t, blood, front) {
    if (front) return spikes(ctx, blood, [1, 2]);
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#000'); g.addColorStop(0.5, '#120808'); g.addColorStop(1, '#1e0c0a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // walls converging
    ctx.fillStyle = '#0a0505'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(150, 0); ctx.lineTo(240, 420); ctx.lineTo(0, H); ctx.fill();
    ctx.beginPath(); ctx.moveTo(W, 0); ctx.lineTo(W - 150, 0); ctx.lineTo(W - 240, 420); ctx.lineTo(W, H); ctx.fill();
    ctx.strokeStyle = 'rgba(120,60,40,0.25)'; for (let y = 20; y < 420; y += 34) { ctx.beginPath(); ctx.moveTo(150 + y * 0.214, y); ctx.lineTo(0, y + y * 0.3); ctx.stroke(); ctx.beginPath(); ctx.moveTo(W - 150 - y * 0.214, y); ctx.lineTo(W, y + y * 0.3); ctx.stroke(); }
    // light from the trapdoor above
    const lg = ctx.createLinearGradient(0, 0, 0, 420); lg.addColorStop(0, 'rgba(255,190,120,0.25)'); lg.addColorStop(1, 'rgba(255,190,120,0)');
    ctx.fillStyle = lg; ctx.beginPath(); ctx.moveTo(330, 0); ctx.lineTo(630, 0); ctx.lineTo(720, 430); ctx.lineTo(240, 430); ctx.fill();
    ctx.fillStyle = '#160a08'; ctx.fillRect(0, 420, W, 120);
    spikes(ctx, blood, [0]);
    // skulls of the earlier fallen
    ctx.fillStyle = '#b5ab96';
    for (const [x, y] of [[270, 488], [700, 500], [600, 520]]) { ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fill(); ctx.fillStyle = '#000'; ctx.fillRect(x - 5, y - 2, 3, 3); ctx.fillRect(x + 2, y - 2, 3, 3); ctx.fillStyle = '#b5ab96'; }
  };
  function spikes(ctx, blood, rows) {
    for (const row of rows) {
      const y = 430 + row * 34, h = 92 - row * 10, sp = 40 - row * 4;
      for (let x = 160 - row * 60; x < W - 160 + row * 60; x += sp) {
        const xx = x + (row % 2) * sp / 2;
        const gg = ctx.createLinearGradient(xx - 8, 0, xx + 8, 0); gg.addColorStop(0, '#3b3a3e'); gg.addColorStop(0.5, '#a9a7ad'); gg.addColorStop(1, '#2a292c');
        ctx.fillStyle = gg; ctx.beginPath(); ctx.moveTo(xx - 9 + row, y); ctx.lineTo(xx, y - h); ctx.lineTo(xx + 9 - row, y); ctx.fill();
        if (blood && Math.abs(xx - W / 2) < 170) { ctx.fillStyle = `rgba(110,8,8,${Math.min(1, blood)})`; ctx.beginPath(); ctx.moveTo(xx - 3, y - h * 0.45); ctx.lineTo(xx, y - h); ctx.lineTo(xx + 3, y - h * 0.45); ctx.fill(); }
      }
    }
  }

  /* --------------------------------------- story backdrop: the master */
  S.drawHall = function (ctx, t, eyes) {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#070304'); g.addColorStop(1, '#1a0806');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // pillars
    ctx.fillStyle = '#0d0505';
    for (const x of [80, 230, 730, 880]) ctx.fillRect(x - 22, 0, 44, H);
    // braziers
    for (const x of [310, 650]) {
      const fl = 0.75 + 0.25 * Math.sin(t * 11 + x) * Math.sin(t * 7.1 + x * 0.3);
      const bg = ctx.createRadialGradient(x, 380, 4, x, 380, 190); bg.addColorStop(0, `rgba(255,140,50,${0.55 * fl})`); bg.addColorStop(1, 'rgba(255,90,20,0)');
      ctx.fillStyle = bg; ctx.fillRect(x - 190, 190, 380, 380);
      ctx.fillStyle = '#1b0f0b'; ctx.fillRect(x - 6, 400, 12, 110); ctx.beginPath(); ctx.moveTo(x - 30, 390); ctx.lineTo(x + 30, 390); ctx.lineTo(x + 18, 410); ctx.lineTo(x - 18, 410); ctx.fill();
      for (let i = 0; i < 5; i++) {
        const h = 30 + 18 * Math.sin(t * 9 + i * 2 + x), w = 10 - i;
        ctx.fillStyle = i % 2 ? `rgba(255,200,90,${0.8 * fl})` : `rgba(255,110,30,${0.8 * fl})`;
        ctx.beginPath(); ctx.moveTo(x - 18 + i * 9 - w, 390); ctx.quadraticCurveTo(x - 18 + i * 9, 390 - h * 1.2, x - 18 + i * 9 + Math.sin(t * 6 + i) * 4, 390 - h); ctx.quadraticCurveTo(x - 18 + i * 9 + w * 0.5, 380 - h * 0.4, x - 18 + i * 9 + w, 390); ctx.fill();
      }
    }
    // dais and seated master
    ctx.fillStyle = '#120706'; ctx.fillRect(330, 420, 300, 30); ctx.fillRect(360, 400, 240, 24);
    ctx.fillStyle = '#050202';
    ctx.beginPath(); ctx.moveTo(400, 402); ctx.quadraticCurveTo(410, 300, 450, 270); ctx.lineTo(510, 270); ctx.quadraticCurveTo(550, 300, 560, 402); ctx.fill();
    ctx.beginPath(); ctx.arc(480, 248, 30, 0, 7); ctx.fill();
    // kabuto horns
    ctx.beginPath(); ctx.moveTo(452, 236); ctx.quadraticCurveTo(420, 200, 430, 168); ctx.quadraticCurveTo(445, 205, 466, 226); ctx.fill();
    ctx.beginPath(); ctx.moveTo(508, 236); ctx.quadraticCurveTo(540, 200, 530, 168); ctx.quadraticCurveTo(515, 205, 494, 226); ctx.fill();
    ctx.fillRect(420, 300, 120, 18);
    if (eyes) {
      const a = 0.6 + 0.4 * Math.sin(t * 3);
      ctx.shadowColor = '#ff2010'; ctx.shadowBlur = 16; ctx.fillStyle = `rgba(255,50,30,${a})`;
      ctx.fillRect(464, 246, 11, 3); ctx.fillRect(486, 246, 11, 3); ctx.shadowBlur = 0;
    }
  };

  S.make = function (n) { return [courtyard, bamboo, shadow][n](); };
  return S;
})();

/* Particles, blood, projectiles' glow, gibs and screen effects. */
const FX = (() => {
  const F = { parts: [], decals: [], gibs: [], pops: [], shake: 0, flash: 0, flashCol: '#fff', gore: true };
  const G = () => Stages.GROUND;
  F.reset = function () { F.parts.length = 0; F.decals.length = 0; F.gibs.length = 0; F.pops.length = 0; F.shake = 0; F.flash = 0; };
  F.add = function (p) { F.parts.push(Object.assign({ life: 0.5, t: 0, vx: 0, vy: 0, g: 0, size: 3, col: '#fff', kind: 'dot', drag: 0 }, p)); };

  F.blood = function (x, y, dir, power) {
    if (!F.gore) return;
    const n = Math.round(10 + power * 14);
    for (let i = 0; i < n; i++) {
      const sp = 120 + Math.random() * 380 * (0.6 + power * 0.6);
      const base = dir === 0 ? -Math.PI / 2 : (dir > 0 ? -0.55 : -Math.PI + 0.55), a = base + (Math.random() - 0.5) * 1.3;
      F.add({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 1500, life: 0.5 + Math.random() * 0.6, size: 2 + Math.random() * 4, col: Math.random() < 0.5 ? '#8e1412' : '#5e0a0a', kind: 'blood' });
    }
  };
  F.bloodJet = function (x, y, ang, sp, n) {
    if (!F.gore) return;
    for (let i = 0; i < n; i++) {
      const a = ang + (Math.random() - 0.5) * 0.5, s = sp * (0.6 + Math.random() * 0.6);
      F.add({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 1400, life: 0.7 + Math.random() * 0.5, size: 2.5 + Math.random() * 4, col: Math.random() < 0.5 ? '#9a1614' : '#650b0b', kind: 'blood' });
    }
  };
  F.spark = function (x, y, col, n) {
    for (let i = 0; i < (n || 12); i++) {
      const a = Math.random() * Math.PI * 2, s = 150 + Math.random() * 380;
      F.add({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.18 + Math.random() * 0.2, size: 2 + Math.random() * 2, col: col || '#fff2c0', kind: 'spark', drag: 4 });
    }
  };
  F.ring = function (x, y, col, r) { F.add({ x, y, life: 0.3, size: r || 40, col: col || '#fff', kind: 'ring' }); };
  F.dust = function (x, y, n) {
    for (let i = 0; i < (n || 8); i++) F.add({ x: x + (Math.random() - 0.5) * 40, y: y - 4, vx: (Math.random() - 0.5) * 160, vy: -20 - Math.random() * 60, life: 0.5 + Math.random() * 0.4, size: 8 + Math.random() * 12, col: 'rgba(170,150,130,0.35)', kind: 'smoke', drag: 2 });
  };

  for (const w of s.split(' ')) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > max && line) { out.push(line); line = w; } else line = t; }
  if (line) out.push(line); ctx.restore(); return out;
}
function go(scene, arg) { G.scene = scene; Input.clear(); if (scene.enter) scene.enter(arg); }
const ease = t => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);

let hits = [];
function button(label, x, y, w, h, on, sel) {
  hits.push({ x: x - w / 2, y: y - h / 2, w, h, on });
  ctx.save();
  if (sel) { ctx.fillStyle = 'rgba(163,32,29,0.85)'; ctx.fillRect(x - w / 2, y - h / 2, w, h); ctx.strokeStyle = '#ffcf7a'; ctx.lineWidth = 2; ctx.strokeRect(x - w / 2 + 1, y - h / 2 + 1, w - 2, h - 2); }
  else { ctx.fillStyle = 'rgba(10,6,6,0.6)'; ctx.fillRect(x - w / 2, y - h / 2, w, h); ctx.strokeStyle = 'rgba(201,162,75,0.5)'; ctx.lineWidth = 1; ctx.strokeRect(x - w / 2 + 0.5, y - h / 2 + 0.5, w - 1, h - 1); }
  ctx.restore();
  text(label, x, y + 1, 24, sel ? '#fff' : '#d9cfbd', { spacing: 2 });
}
function menuNav(list, sel, evs, onPick) {
  for (const e of evs) {
    if (e.m === 'up' || e.m === 'left') { sel = (sel + list.length - 1) % list.length; Audio.sfx('ui'); }
    if (e.m === 'down' || e.m === 'right') { sel = (sel + 1) % list.length; Audio.sfx('ui'); }
    if (e.m === 'ok' && !e.touch) { Audio.sfx('confirm'); onPick(sel); }
    if (e.m === 'tap') for (const h of hits) if (e.x >= h.x && e.x <= h.x + h.w && e.y >= h.y && e.y <= h.y + h.h) { Audio.sfx('confirm'); h.on(); }
  }
  return sel;
}

const LOGO = [
  '██▓▓▒▒░░ ██▓▒',
  '█▓▒       █▓▒',
  '█▓▒       █▓▒                                   (R)',
  '█▓▒       █▓▒▒▒░░ ██▓▒░░ ██▓▒▒░ ██▓ ▒░░ ██▓▓▒░░',

  '     █▓▒  █▓▒  ▒░ ██▓▒░░ ██▓▒▒░ ██▓▓▒▒░ ██▓ ▒░░',
  '     █▓▒                    ▓▒░',
  '     █▓▒                 ██▓▒▒░',
  '██▓▓▒▒░░',
];
function drawLogo(x, y, cell, t, alpha) {
  // each 1996 shade glyph becomes a cell of light: █ solid, ▓ ▒ ░ fading out
  const dens = { '█': 1, '▓': 0.72, '▒': 0.46, '░': 0.22 };
  ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha;
  const cw = cell * 0.6, ch = cell;
  for (let r = 0; r < LOGO.length; r++) for (let c = 0; c < LOGO[r].length; c++) {
    const k = dens[LOGO[r][c]]; if (!k) continue;
    const px = x + c * cw, py = y + r * ch;
    const shine = Math.max(0, 1 - Math.abs(((t * 300) % 1600) - 300 - (px - x)) / 70);
    ctx.fillStyle = `rgba(${85 + shine * 170 | 0},255,255,${k})`;
    ctx.shadowColor = 'rgba(85,255,255,0.8)'; ctx.shadowBlur = 10 * k;
    ctx.fillRect(px, py, cw - 1, ch - 1);
  }
  ctx.restore();
  text('(R)', x + 48.6 * cw, y + 2.5 * ch, cell * 0.9, '#55ffff', { font: FONT.dos, weight: 400 });
}

  const b = G.banner; if (!b) return;
  b.t += G.frameDt || 1 / 60; if (b.t > b.dur) { G.banner = null; return; }
  const k = ease(b.t / 0.25), a = b.t > b.dur - 0.3 ? (b.dur - b.t) / 0.3 : 1;
  ctx.save(); ctx.globalAlpha = a;
  text(b.s, W / 2, 210, 84 * (1.3 - 0.3 * k), b.col, { font: FONT.disp, weight: 800, stroke: 10, glow: b.col, blur: 24, spacing: 4 });
  if (b.sub) text(b.sub, W / 2, 278, 30, '#ebe3d3', { stroke: 5, spacing: 4 });
  ctx.restore();
}
const ARROW = { 8: '↑', 2: '↓', 4: '←', 6: '→', 5: '●', 1: '↙', 3: '↘', 7: '↖', 9: '↗' };
function codeArrows(code, face) {
  return code.split('').map(d => face < 0 && (d === '4' || d === '6') ? ARROW[d === '4' ? 6 : 4] : (ARROW[d] || d)).join(' ');
}
function drawCodeEntry() {
  const ce = G.codeEntry, face = ce.who.face;
  const list = Object.entries(ce.codes);
  const top = 446 - 12 - list.length * 30;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(W / 2 - 200, top, 400, list.length * 30 + 8);
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(W / 2 - 200, 446, 400, 74);
  ctx.strokeStyle = '#a3201d'; ctx.lineWidth = 2; ctx.strokeRect(W / 2 - 200, 446, 400, 74);
  ctx.fillStyle = '#a3201d'; ctx.fillRect(W / 2 - 198, 514, 396 * Math.max(0, ce.t / ce.max), 4);
  ctx.restore();
  G.codeRows = list.map(([code], i) => ({ code, y: top + 19 + i * 30 }));
  list.forEach(([code, kind], i) => {
    const y = top + 19 + i * 30, ok = squash(code).startsWith(squash(ce.d));
    const col = ok ? '#ffdd55' : '#6b5f50';
    text(FATAL_NAMES[kind], W / 2 - 20, y, 20, col, { align: 'right', spacing: 2 });
    text(codeArrows(code, face), W / 2 + 4, y, 28, col, { font: FONT.dos, weight: 400, align: 'left' });
  });
  const s = codeArrows(ce.d, face);
  text(s || '_', W / 2, 476, 36, '#ffffff', { font: FONT.dos, weight: 400 });
  text(isTouch() ? 'TAP A FATALITY, OR FOLLOW ITS CODE ON THE STICK' : 'FOLLOW A CODE WITH THE ARROWS OR NUMBER PAD · ● = PUNCH', W / 2, 505, 14, '#c9b9a0', { spacing: 1 });
}

/* ------------------------------------------------------------ pause */
const Pause = {
  sel: 0,
  list() {
    return [['RESUME', () => { G.paused = false; }], ['HOW TO PLAY', () => { go(Help, 'pause'); G.paused = false; }],
      [`SOUND: ${soundPref ? 'ON' : 'OFF'}`, () => { soundPref = !soundPref; Audio.setOn(soundPref); store.set('sound', soundPref); }],
      ['QUIT TO TITLE', () => { G.paused = false; Input.twoP = false; go(Title); }],
      ['ALL GAMES', toMenu]];
  },
  update(dt, evs) { if (evs.some(e => e.m === 'pause' || e.m === 'back')) { G.paused = false; return; } const l = this.list(); this.sel = menuNav(l, this.sel, evs, i => l[i][1]()); },
  draw() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
    text('PAUSED', W / 2, 120, 54, '#ebe3d3', { font: FONT.disp, weight: 800, spacing: 8 });
    hits = []; this.list().forEach(([l, on], i) => button(l, W / 2, 210 + i * 64, 340, 50, on, i === this.sel));
  },
};

/* ------------------------------------------------------------ match end */
function endMatch(playerWon) {
  Input.take(0);
  if (G.versus) return go(VersusEnd, playerWon ? G.p : G.e);
  if (!playerWon) return go(GameOver);
  if (G.stageIdx >= 2) return go(Ending);
  G.stageIdx++;
  go(Story, { kind: 'next' });
}
const VersusEnd = {
  enter(w) { this.w = w; this.t = 0; this.sel = 0; Audio.music('title'); },
  update(dt, evs) { this.t += dt; const l = [['REMATCH', () => startVersus()], ['TITLE', () => { Input.twoP = false; go(Title); }]]; this.sel = menuNav(l, this.sel, evs, i => l[i][1]()); this.l = l; },
  draw() {
    Stages.drawHall(ctx, this.t, false); ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
    text(`${NAMES[this.w.key]} WINS`, W / 2, 180, 72, '#ffdd55', { font: FONT.disp, weight: 800, stroke: 8, glow: '#aa5500' });
    hits = []; (this.l || []).forEach(([l, on], i) => button(l, W / 2 - 110 + i * 220, 380, 200, 50, on, i === this.sel));
  },
};
const GameOver = {
  enter() { this.t = 0; this.sel = 0; Audio.music(null); Audio.play('T250 O1E- O1E- O0E O0E O0G- O0E', { voice: 'brass' }); this.f = new Fighter(ENEMIES[G.stageIdx], 560, -1, false, 0); this.f.set('victory', this.f.def.victory, 4); Audio.say('Game over', 0.8, 0.1); },
  update(dt, evs) {
    this.t += dt; this.f.update(G, dt, this.f);
    const l = [['FIGHT AGAIN', () => startStage(G.stageIdx)], ['TITLE', () => go(Title)]]; this.l = l;
    if (this.t > 1) this.sel = menuNav(l, this.sel, evs, i => l[i][1]());
  },
  draw() {
    ctx.fillStyle = '#050303'; ctx.fillRect(0, 0, W, H);
    const g = ctx.createRadialGradient(560, 380, 10, 560, 380, 300); g.addColorStop(0, 'rgba(140,20,10,0.35)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#140808'; ctx.fillRect(0, GY, W, H - GY);
    this.f.draw(ctx, { rim: '#ff7050', light: -1, shadow: 'rgba(0,0,0,0.5)', wind: 0 }, 1 / 60);
    // the fallen hero
    const hero = { x: 300, y: 0, face: 1, pose: Rig.copy(Rig.POSES.down), look: Rig.LOOKS[G.hero], grounded: true };
    Retro.wrap(ctx, c => Rig.draw(c, Rig.solve(hero, GY), { rim: '#ff7050', light: 1 }));
    text('G A M E   O V E R', W / 2, 80, 56, '#ff3b2f', { font: FONT.dos, weight: 400, glow: '#aa0000' });
    text('YOU HAVE FALLEN, WEAK-WILLED WARRIOR. THE SHOTAKAN', W / 2, 140, 26, '#ebe3d3', { font: FONT.dos, weight: 400 });
    text('TAKAMARA HAS NO PLACE FOR THOSE WHO CANNOT STAND.', W / 2, 170, 26, '#ebe3d3', { font: FONT.dos, weight: 400 });
    hits = []; if (this.t > 1) (this.l || []).forEach(([l, on], i) => button(l, W / 2 - 120 + i * 240, 500, 220, 46, on, i === this.sel));
  },
};
const Ending = {
  enter() {
    this.t = 0; Audio.music('title'); Audio.play('T250 O1E O1G O2C O2E O2G O2E O2G.', { voice: 'brass' });
    setTimeout(() => { if (G.scene === Ending) Audio.play('T200 O0E O0E O0E.O1E O1G O1G O2G O3F O1E', { voice: 'brass' }); }, 2600);
    this.f = new Fighter(G.hero, 330, 1, false, 0); this.f.set('victory', this.f.def.victory, 3); G.stage = Stages.make(2);
    Audio.say(NAMES[G.hero].replace('Ō', 'O') + ' wins. Flawless.', 0.85, 0.2);
  },
  update(dt, evs) { this.t += dt; this.f.update(G, dt, this.f); if (this.t > 4 && evs.some(e => e.m === 'ok' || e.m === 'tap')) go(Title); },
  draw() {
    Retro.wrap(ctx, c => G.stage.back(c, 110, this.t), true);
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
    this.f.draw(ctx, G.stage, 1 / 60);
    // Frill's remains, a smear of shadow
    ctx.fillStyle = 'rgba(10,14,30,0.9)'; ctx.beginPath(); ctx.ellipse(600, GY + 2, 120, 12, 0, 0, 7); ctx.fill();
    for (let i = 0; i < 3; i++) FX.smoke(540 + Math.random() * 120, GY - 4, 'rgba(120,180,255,0.18)');
    FX.update(1 / 60); Retro.wrap(ctx, c => FX.draw(c));
    const a = k => ease((this.t - k) / 0.8);
    ctx.globalAlpha = a(0.3); text('F R I L L   H A S   F A L L E N', W / 2, 80, 44, '#ff3b2f', { font: FONT.dos, weight: 400, glow: '#aa0000' });
    ctx.globalAlpha = a(1.5); text('YOU ARE THE CHAMPION OF THE SHOTAKAN TAKAMARA.', W / 2, 150, 28, '#ffffff', { font: FONT.dos, weight: 400 });
    ctx.globalAlpha = a(2.8); text('...BUT THE MASTER STILL WAITS IN THE SHADOWS.', W / 2, 186, 28, '#ff5555', { font: FONT.dos, weight: 400 });
    ctx.globalAlpha = a(4.2); text('TO BE CONTINUED IN   S H O G U N   I I', W / 2, 250, 32, '#55ffff', { font: FONT.dos, weight: 400, glow: '#00aaaa' });
    ctx.globalAlpha = a(5); text('MYSTICAL SOFTWARE  (C)1996  ·  REMASTERED 2026', W / 2, 515, 20, '#00aaaa', { font: FONT.dos, weight: 400 });
    ctx.globalAlpha = 1;
  },
};

/* ================================================================ FATALITIES */
function startFatality(kind, att, def) {
  G.found[kind] = 1; store.set('found', G.found);
  Fight.phase = 'fatal'; G.fighting = false;
  const steps = { head: fatalHead, pit: fatalPit, throw: fatalPit, run: fatalRun }[kind];
  G.fatal = { t: 0, dim: 0, kind, done: {}, att, def, run: steps };
  att.scripted = true; def.scripted = true;
  Audio.duck(0.25, 6);
  G.fatal.update = function (dt) {
    this.t += dt; this.dim = Math.min(1, this.dim + dt * 2);
    const once = (k, at, fn) => { if (this.t >= at && !this.done[k]) { this.done[k] = 1; fn(); } };
    this.run(this, once, dt);
    once('banner', this.bannerAt || 99, () => { Fight.banner('FATALITY', '#ff2a1f', 2.6); Audio.sfx('fatality'); Audio.say('Fatality', 0.75, 0.05); FX.flash = 0.5; FX.flashCol = '#a00'; });
    once('wins', (this.bannerAt || 99) + 2.8, () => { Fight.banner(`${NAMES[att.key]} WINS`, '#ffdd55', 2.2, FATAL_NAMES[kind]); });
    once('end', (this.bannerAt || 99) + 5.2, () => { G.fatal = null; G.pit = null; endMatch(att === G.p); });
  };
}
function approach(f, x, dt, sp) { const d = x - f.x; if (Math.abs(d) > 4) { f.x += Math.sign(d) * Math.min(Math.abs(d), sp * dt); f.target = Math.sin(G.time * 9) > 0 ? 'walk1' : 'walk2'; f.speed = 10; return false; } return true; }

function fatalHead(F, once, dt) {
  const a = F.att, d = F.def, t = F.t;
  if (t < 0.7) { if (approach(a, d.x - a.face * 84, dt, 220)) { a.target = a.def.idle[0]; } }
  once('wind', 0.75, () => { a.target = 'chargeS'; a.speed = 14; Audio.sfx('whoosh'); });
  once('rip', 1.15, () => {
    a.target = 'upperH'; a.speed = 40; Audio.sfx('crunch'); Audio.sfx('blood');
    const J = d.solve(); d.drawOpts = { noHead: true };
    FX.gibs.push(new FX.Gib(J, 'head', J.Hd, a.face * 160, -1050, a.face * 9, { restOff: 14 }));
    FX.shake = 16; G.hitstop = 0.15; FX.flash = 0.35; FX.flashCol = '#900';
  });
  if (t > 1.15 && t < 3.0 && d.J) { const n = d.J.N; FX.bloodJet(n[0], n[1] - 4, -Math.PI / 2 + Math.sin(t * 8) * 0.3, 520, 2); }
  once('sag', 2.4, () => { d.target = 'kneel'; d.speed = 5; Audio.sfx('fall'); });
  once('drop', 3.1, () => { d.target = 'down'; d.speed = 7; d.freeRot = false; d.vx = -d.face * 260; Audio.sfx('fall'); FX.dust(d.x, GY, 12); });
  if (t > 3.1) d.pose.rot += (-88 - d.pose.rot) * Math.min(1, dt * 7);
  once('vict', 2.0, () => { a.target = a.def.victory; a.speed = 5; });
  F.bannerAt = 3.4;
}

function fatalPit(F, once, dt) {
  const a = F.att, d = F.def, t = F.t, thrown = F.kind === 'throw';
  if (t < 0.7) { if (approach(a, d.x - a.face * (thrown ? 40 : 80), dt, 220)) a.target = a.def.idle[0]; }
  if (thrown) {
    once('grab', 0.75, () => { a.target = 'grab'; a.speed = 16; Audio.sfx('catch'); });
    once('lift', 1.1, () => { a.target = 'carry'; a.speed = 9; d.freeRot = true; d.target = 'heldUp'; d.speed = 8; d.grounded = true; });
    if (t > 1.1 && t < 1.8) { d.x += (a.x - d.x) * Math.min(1, dt * 8); d.y += (-190 - d.y) * Math.min(1, dt * 8); d.pose.rot += (-90 - d.pose.rot) * Math.min(1, dt * 8); }
    once('toss', 1.8, () => { Audio.sfx('whoosh'); d.state = 'launch'; d.grounded = false; d.vy = -1700; d.vx = a.face * 60; });
  } else {
    once('crouch', 0.75, () => { a.target = a.def.upperP[0]; a.speed = 16; });
    once('up', 1.05, () => { a.target = a.def.upperP[1]; a.speed = 40; Audio.sfx('heavy'); FX.blood(d.x, GY - 160, a.face, 1.5); FX.shake = 12; G.hitstop = 0.1; d.state = 'launch'; d.grounded = false; d.vy = -1800; d.vx = a.face * 40; d.freeRot = true; });
  }
  if (d.state === 'launch' && !G.pit) d.pose.rot -= dt * 500;
  once('cut', thrown ? 2.35 : 1.6, () => {
    // cut to the pit below the arena floor
    G.pit = { blood: 0 }; G.cam = 0; d.x = W / 2; d.y = -900; d.vy = 300; d.vx = 0; d.grounded = true; d.state = 'pitfall'; d.target = 'impaled'; d.speed = 4; d.freeRot = true; d.pose.rot = -60;
    FX.parts.length = 0; FX.decals.length = 0;
  });
  if (G.pit && !F.done.impale) {
    d.vy += 2200 * dt; d.y += d.vy * dt; d.pose.rot += (-84 - d.pose.rot) * Math.min(1, dt * 5);
    if (d.y >= -70) {
      d.y = -70; d.vy = 0; F.done.impale = 1;
      Audio.sfx('spikes'); Audio.sfx('blood'); FX.shake = 22; FX.flash = 0.5; FX.flashCol = '#800';
      for (let i = 0; i < 4; i++) FX.bloodJet(W / 2 - 60 + i * 40, GY - 90, -Math.PI / 2 + (Math.random() - 0.5), 420, 14);
      F.impaleT = t;
    }
  }
  if (G.pit) {
    G.pit.blood = Math.min(1, G.pit.blood + (F.done.impale ? dt * 0.8 : 0));
    if (F.done.impale && Math.random() < 0.3) FX.add({ x: W / 2 - 80 + Math.random() * 160, y: GY - 60, vy: 40, g: 900, life: 0.6, size: 2 + Math.random() * 2, col: '#7a0c0a', kind: 'blood' });
  }
  F.bannerAt = thrown ? 3.4 : 2.8;
}
// the pit uses the fighter's own physics off, so keep its grounded flag false while falling
function fatalRun(F, once, dt) {
  const a = F.att, d = F.def, t = F.t;
  if (t < 0.55) { if (approach(a, d.x - a.face * 150, dt, 260)) a.target = a.def.idle[0]; }
  once('lunge', 0.6, () => { a.target = 'thrust'; a.speed = 30; Audio.sfx('dash'); });
  if (t > 0.6 && t < 0.78) a.x += a.face * 470 * dt;
  once('pierce', 0.78, () => {
    Audio.sfx('sliceHit'); Audio.sfx('blood'); d.target = 'hitLo'; d.speed = 20; G.hitstop = 0.18; FX.shake = 12;
    a.drawOpts = { bloodBlade: true };
  });
  if (t > 0.8 && t < 1.7 && d.J) FX.bloodJet(d.x + a.face * 26, GY - 140 * d.s, a.face > 0 ? -0.3 : Math.PI + 0.3, 380, 2);
  once('pull', 1.7, () => { a.target = 'sIdle'; a.speed = 8; d.target = 'hitHi'; d.speed = 8; Audio.sfx('slash'); });
  if (t > 1.7 && t < 2.1) a.x -= a.face * 220 * dt;
  once('raise', 2.15, () => { a.target = 'cleaveS'; a.speed = 14; });
  once('cleave', 2.55, () => {
    a.target = 'cleaveH'; a.speed = 40; Audio.sfx('slash'); Audio.sfx('crunch'); Audio.sfx('blood');
    const J = d.solve(); d.drawOpts = { only: 'lower' };
    FX.gibs.push(new FX.Gib(J, 'upper', J.H, a.face * 210, -620, a.face * 3.2, { restOff: 34, rim: G.stage.rim, light: G.stage.light }));
    FX.shake = 18; G.hitstop = 0.16; FX.flash = 0.4; FX.flashCol = '#900';
  });
  if (t > 2.55 && t < 4 && d.J) FX.bloodJet(d.J.H[0], d.J.H[1] - 6, -Math.PI / 2 + Math.sin(t * 9) * 0.35, 460, 2);
  once('legs', 3.2, () => { d.target = 'kneel'; d.speed = 5; Audio.sfx('fall'); });
  once('vict', 3.5, () => { a.target = 'sVictory'; a.speed = 5; });
  F.bannerAt = 3.6;
}

/* ================================================================ LOOP */
let last = performance.now(), q = 1;
function resize() {
  const r = cv.getBoundingClientRect();
  q = Math.min(2.5, Math.max(1, (window.devicePixelRatio || 1) * r.width / W));
  cv.width = Math.round(W * q); cv.height = Math.round(H * q);
}
addEventListener('resize', resize);
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  Input.menu.push({ m: 'tap', x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H });
  if (e.pointerType === 'touch') { Input.touch = true; document.body.classList.add('touch'); }
});
addEventListener('touchstart', () => { Input.touch = true; document.body.classList.add('touch'); }, { passive: true });

// phones: go full screen on the first tap (browsers only allow it from a tap)
// opened from the collection menu: the menu page holds full screen and takes us back
const inMenu = (() => { try { return parent !== window && parent.location.origin === location.origin; } catch (e) { return false; } })();
function goFull() {
  if (inMenu) { parent.postMessage('shogun:full', location.origin); return; }
  const d = document.documentElement, fs = d.requestFullscreen || d.webkitRequestFullscreen;
  if (!matchMedia('(pointer: coarse)').matches || !fs || document.fullscreenElement || document.webkitFullscreenElement) return;
  try { const r = fs.call(d); if (r && r.catch) r.catch(() => {}); } catch (e) {}
}
addEventListener('pointerdown', goFull, { once: true, capture: true });

// back to the Shogun Classics menu (the folder above this game)
function toMenu(e) {
  if (e && e.preventDefault) e.preventDefault();
  if (inMenu) { parent.postMessage('shogun:menu', location.origin); return; }
  let same = false;
  try { same = !!document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1; } catch (err) {}
  if (same) history.back(); else location.href = '../';
}
document.getElementById('btnMenu').addEventListener('click', toMenu);

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  G.time += dt; G.frameDt = dt;
  Input.pollPads();
  document.body.classList.toggle('two', Input.twoP);
  Input.fourWay = !!G.codeEntry;   // during FINISH HIM the stick reads only up, down, left and right
  document.body.classList.toggle('front', G.scene === Title || G.scene === Power);   // corner MENU link only on the title screens
  const evs = Input.takeMenu();
  try {
    G.scene.update(dt, evs);
    ctx.setTransform(q, 0, 0, q, 0, 0);
    G.scene.draw();
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
Input.bindTouch(document.getElementById('touch'));
if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
resize(); go(Power); requestAnimationFrame(frame);

</script>
