<title>Shogun Remastered</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Shippori+Mincho+B1:wght@800&family=VT323&display=swap">
</head>
<body>
<style>
:root { --bg: #050303; --panel: #0d0807; --line: #3a1a14; --accent: #a3201d; --brass: #c9a24b; --fg: #ebe3d3; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); box-sizing: border-box; }
#screen { position: relative; width: min(100%, calc((100vh - 0px) * 16 / 9)); width: min(100%, calc(100dvh * 16 / 9)); aspect-ratio: 16 / 9; max-width: 100%; }
#cv { display: block; width: 100%; height: 100%; background: #000; outline: none; image-rendering: auto; }
#touch { display: none; }
body.touch #touch { display: flex; }
.pad { position: relative; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.06), rgba(255,255,255,0.02) 60%, rgba(0,0,0,0.25)); border: 2px solid rgba(201,162,75,0.45); touch-action: none; flex: none; }
.pad::before, .pad::after { content: ""; position: absolute; background: rgba(201,162,75,0.18); }
.pad::before { left: 50%; top: 14%; bottom: 14%; width: 2px; margin-left: -1px; }
.pad::after { top: 50%; left: 14%; right: 14%; height: 2px; margin-top: -1px; }
#knob, .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #5a4a3a, #1a1210); border: 2px solid rgba(201,162,75,0.7); pointer-events: none; z-index: 1; }
.btns { display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; gap: 12px; align-items: center; flex: none; }
.b { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font: 700 26px/1 'Barlow Condensed', 'Arial Narrow', sans-serif; letter-spacing: 1px; color: #fff; touch-action: none; border: 2px solid rgba(255,255,255,0.35); }
#btnP, #btnP2 { background: radial-gradient(circle at 40% 35%, #d9322b, #7a0f0b); grid-row: 1 / 3; grid-column: 2; width: 98px; height: 98px; font-size: 30px; }
#btnSP, #btnSP2 { background: radial-gradient(circle at 40% 35%, #e8a33a, #7a4b0b); width: 64px; height: 64px; font-size: 20px; }
#btnPause { background: rgba(255,255,255,0.08); width: 46px; height: 46px; font-size: 16px; border-color: rgba(255,255,255,0.2); }
.b.on { filter: brightness(1.5); transform: scale(0.95); }
#btnMenu { display: none; position: fixed; z-index: 4; top: max(8px, env(safe-area-inset-top, 0px)); left: max(8px, env(safe-area-inset-left, 0px));
  font: 700 14px/1 'Barlow Condensed', 'Arial Narrow', sans-serif; letter-spacing: 2px; color: rgba(235,227,211,0.75); text-decoration: none;
  background: rgba(0,0,0,0.45); border: 1px solid rgba(201,162,75,0.35); border-radius: 6px; padding: 7px 10px 6px; }
body.front #btnMenu { display: block; }
#btnMenu:hover, #btnMenu:focus-visible { color: #fff; border-color: var(--brass); }
/* two players on one phone: P1 on the left, P2 mirrored on the right */
.p2grp { display: none; }
.p1grp { display: contents; }
.who { position: absolute; top: -18px; left: 0; right: 0; text-align: center; font: 700 13px/1 'Barlow Condensed', 'Arial Narrow', sans-serif; letter-spacing: 2px; color: var(--brass); display: none; }
body.touch.two .who { display: block; }
body.touch.two .p2grp { display: flex; gap: 10px; align-items: flex-end; margin-left: auto; position: relative; }
body.touch.two #touch > .p1grp { display: flex; gap: 10px; align-items: flex-end; position: relative; }
body.touch.two .tip { display: none !important; }
body.touch.two .pad { width: 112px; height: 112px; }
body.touch.two .knob, body.touch.two #knob { width: 44px; height: 44px; margin: -22px 0 0 -22px; }
body.touch.two #btnP, body.touch.two #btnP2 { width: 66px; height: 66px; font-size: 24px; }
body.touch.two #btnSP, body.touch.two #btnSP2 { width: 48px; height: 48px; font-size: 16px; }
body.touch.two #btnPause { width: 40px; height: 40px; }
@media (orientation: portrait) {
  body.touch.two #touch { flex-direction: column; flex-wrap: nowrap; align-items: stretch; justify-content: space-around; gap: 22px; }
  body.touch.two #touch > .p1grp { justify-content: space-between; }
  body.touch.two .p2grp { margin-left: 0; justify-content: space-between; flex-direction: row-reverse; }
}
/* portrait phone: controls live under the screen */
@media (orientation: portrait) {
  body.touch #app { justify-content: flex-start; padding-top: max(10px, env(safe-area-inset-top, 0px)); }
  body.touch #screen { width: 100%; }
  body.touch #touch { width: 100%; flex: 1; align-items: flex-end; flex-wrap: wrap; align-content: space-between; justify-content: space-between; padding: 12px max(22px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px)); box-sizing: border-box; background: linear-gradient(var(--panel), #000); border-top: 1px solid var(--line); }
}
/* landscape phone: controls float over the screen corners */
@media (orientation: landscape) {
  body.touch #touch { position: fixed; inset: auto 0 0 0; justify-content: space-between; align-items: flex-end; padding: 0 max(18px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); pointer-events: none; opacity: 0.72; }
  body.touch #touch > * { pointer-events: auto; }
  body.touch .pad { width: 130px; height: 130px; }
  body.touch .b { width: 70px; height: 70px; }
  body.touch #btnP { width: 84px; height: 84px; }
  body.touch #btnSP { width: 56px; height: 56px; }
}
  .tip { display: none; }
@media (orientation: portrait) { body.touch .tip { display: block; width: 100%; margin: 6px 0 0; text-align: center; font: 600 15px/1.4 'Barlow Condensed', 'Arial Narrow', sans-serif; letter-spacing: 1px; color: #8c7f6c; } body.touch #touch { padding-bottom: max(40px, env(safe-area-inset-bottom, 0px)); } }
@media (prefers-reduced-motion: reduce) { .b.on { transform: none; } }
</style>
<div id="app">
  <div id="screen"><canvas id="cv" width="960" height="540" tabindex="0" aria-label="Shogun game screen"></canvas></div>
  <div id="touch" aria-label="Touch controls">
    <p class="tip">Hold back to block · down + P uppercut · up + P jump kick · SP special</p>
    <div class="p1grp">
      <span class="who">PLAYER 1</span>
      <div class="pad" id="dpad"><div id="knob"></div></div>
      <div class="btns">
        <div class="b" id="btnPause" role="button" aria-label="Pause">II</div>
        <div class="b" id="btnP" role="button" aria-label="Punch">P</div>
        <div class="b" id="btnSP" role="button" aria-label="Special move">SP</div>
      </div>
    </div>
    <div class="p2grp" aria-label="Player 2 touch controls">
      <span class="who">PLAYER 2</span>
      <div class="btns">
        <div class="b" id="btnP2" role="button" aria-label="Player 2 punch">P</div>
        <div class="b" id="btnSP2" role="button" aria-label="Player 2 special move">SP</div>
      </div>
      <div class="pad" id="dpad2"><div class="knob" id="knob2"></div></div>
    </div>
  </div>
  <a id="btnMenu" href="../" aria-label="Back to the Shogun Classics menu">&#9664; MENU</a>
</div>

/* SHOGUN Remastered: procedural audio.
   Nothing is sampled. The 1996 PLAY strings are parsed and re-voiced with
   taiko, koto and shakuhachi patches, and the fight loops are generated from
   a fixed seed so each stage always has the same theme. */
const Audio = (() => {
  const A = { ctx: null, on: true, voice: true, musicVol: 0.32, sfxVol: 0.8, track: null };
  let master, musicBus, sfxBus, verb, noiseBuf;
  const clipBufs = {};

  A.init = function () {
    if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const ctx = A.ctx = new C();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -12; comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.2;
    master = ctx.createGain(); master.gain.value = A.on ? 0.9 : 0;
    comp.connect(master); master.connect(ctx.destination);
    musicBus = ctx.createGain(); musicBus.gain.value = A.musicVol; musicBus.connect(comp);
    sfxBus = ctx.createGain(); sfxBus.gain.value = A.sfxVol; sfxBus.connect(comp);
    // small hall: generated impulse response
    verb = ctx.createConvolver();
    const len = ctx.sampleRate * 2.2, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
    }
    verb.buffer = ir;
    const vg = ctx.createGain(); vg.gain.value = 0.35; verb.connect(vg); vg.connect(comp);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    // the recorded announcer: decode each clip once
    if (typeof VOICE_CLIPS !== 'undefined') for (const [k, b64] of Object.entries(VOICE_CLIPS)) {
      const bin = atob(b64), u = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      ctx.decodeAudioData(u.buffer, buf => { clipBufs[k] = buf; }, () => {});
    }
  };

  A.setOn = function (on) {
    A.on = on;
    if (master) master.gain.setTargetAtTime(on ? 0.9 : 0, A.ctx.currentTime, 0.05);
    if (!on && window.speechSynthesis) speechSynthesis.cancel();
  };

  const now = () => A.ctx.currentTime;
  function noise(t, dur, dest, type, f0, f1, q, g0, attack) {
    const ctx = A.ctx, s = ctx.createBufferSource(); s.buffer = noiseBuf;
    s.playbackRate.value = 0.8 + Math.random() * 0.4;
    const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q || 1;
    f.frequency.setValueAtTime(f0, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(g0, t + (attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest);
    s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
    return g;
  }
  function osc(t, type, f0, f1, dur, dest, g0, attack, glide) {
    const ctx = A.ctx, o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + (glide || dur));
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(g0, t + (attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
    return { o, g };
  }
  function send(node, amt) { const g = A.ctx.createGain(); g.gain.value = amt; node.connect(g); g.connect(verb); }

  /* ------------------------------------------------------------ voices */
  const V = {};
  V.taiko = (t, g, dest, hz) => {
    hz = hz || 70;
    osc(t, 'sine', hz * 2.2, hz, 0.55, dest, g, 0.003, 0.09);
    const n = noise(t, 0.12, dest, 'lowpass', 900, 200, 1, g * 0.5);
    send(n, 0.4);
  };
  V.rim = (t, g, dest) => { noise(t, 0.05, dest, 'bandpass', 2600, 0, 4, g); osc(t, 'square', 820, 0, 0.03, dest, g * 0.15); };
  V.shaker = (t, g, dest) => noise(t, 0.05, dest, 'highpass', 7000, 0, 1, g);
  V.koto = (t, f, dur, g, dest) => {
    const ctx = A.ctx;
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
    o1.type = 'triangle'; o2.type = 'sawtooth'; o1.frequency.value = f; o2.frequency.value = f * 1.003;

    lp.frequency.setValueAtTime(f * 9, t); lp.frequency.exponentialRampToValueAtTime(f * 1.4, t + 0.35);
    const gg = ctx.createGain();
    gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(g, t + 0.004);
    gg.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.4, dur * 1.6));
    const m2 = ctx.createGain(); m2.gain.value = 0.35;
    o1.connect(lp); o2.connect(m2); m2.connect(lp); lp.connect(gg); gg.connect(dest); send(gg, 0.5);
    o1.start(t); o2.start(t); o1.stop(t + dur * 1.6 + 0.5); o2.stop(t + dur * 1.6 + 0.5);
  };
  V.flute = (t, f, dur, g, dest) => {
    const ctx = A.ctx, o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 5.2; lg.gain.value = f * 0.012;
    lfo.connect(lg); lg.connect(o.frequency);
    const o3 = ctx.createOscillator(); o3.type = 'triangle'; o3.frequency.value = f * 2; const g3 = ctx.createGain(); g3.gain.value = 0.12;
    o3.connect(g3);
    const gg = ctx.createGain();
    gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(g, t + 0.06);
    gg.gain.setValueAtTime(g * 0.85, t + Math.max(0.07, dur - 0.08)); gg.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.12);

    [o, lfo, o3].forEach(x => { x.start(t); x.stop(t + dur + 0.2); });
    return b;
  };
  V.bass = (t, f, dur, g, dest) => {
    const ctx = A.ctx, o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(f * 6, t); lp.frequency.exponentialRampToValueAtTime(f * 1.5, t + dur);
    const s = ctx.createOscillator(); s.type = 'sine'; s.frequency.value = f / 2;
    const gs = ctx.createGain(); gs.gain.value = 0.7;
    const gg = ctx.createGain(); gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(g, t + 0.01); gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(lp); s.connect(gs); gs.connect(lp); lp.connect(gg); gg.connect(dest);
    o.start(t); s.start(t); o.stop(t + dur + 0.05); s.stop(t + dur + 0.05);
  };
  V.drone = (t, f, dur, g, dest) => {
    const ctx = A.ctx, gg = ctx.createGain();

    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);

    for (let x = -600; x < ARENA + 600; x += 70) { ctx.beginPath(); ctx.moveTo(ARENA / 2 + (x - ARENA / 2) * 0.55, top); ctx.lineTo(x, H); ctx.stroke(); }
  }

  /* ---------------------------------------------- 1: temple courtyard, dusk */
  function courtyard() {
    const r = rng(11);

    const mid = layer(pw(0.25), H, (c, w) => {

  /* -------------------------------------------- 2: bamboo grove, moonlight */
  function bamboo() {
    const r = rng(23);
    const sky = layer(W, H, (c) => {
      const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#04070f'); g.addColorStop(0.6, '#10233a'); g.addColorStop(1, '#1d3a4a');

        ctx.beginPath(); ctx.moveTo(x, H); ctx.quadraticCurveTo(x + b.lean * 200, 250, x + sway + b.lean * 400, top); ctx.stroke();
        ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = b.w + 1;
        for (let y = H - 70; y > top + 30; y -= 64) { const k = (H - y) / (H - top); const xx = x + (b.lean * 400 + sway) * k * k; ctx.beginPath(); ctx.moveTo(xx - b.w / 2 - 1, y); ctx.lineTo(xx + b.w / 2 + 1, y); ctx.stroke(); }

          for (const d of [-1, 1]) { ctx.beginPath(); ctx.ellipse(xx + d * (b.w + 14), y - 8, 18 + b.w * 0.6, 3.5 + b.w * 0.12, d * 0.4 + Math.sin(t + b.ph) * 0.1, 0, 7); ctx.fill(); }

      shadow: 'rgba(0,8,12,0.6)', bloodFloor: '#3d0a0a',

  /* ----------------------------------------------- 3: Frill's shadow shrine */
  function shadow() {
    const r = rng(77);
    const sky = layer(W, H, (c) => {
      const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#020208'); g.addColorStop(0.55, '#0c0b22'); g.addColorStop(1, '#141634');

    });

          const g = ctx.createLinearGradient(0, y - 30, 0, y + 30); g.addColorStop(0, 'rgba(120,170,255,0)'); g.addColorStop(0.5, 'rgba(120,170,255,0.07)'); g.addColorStop(1, 'rgba(120,170,255,0)');
          ctx.fillStyle = g; ctx.fillRect(0, y - 30, W, 60);

  /* --------------------------------------- the spike pit, for fatalities */
  S.drawPit = function (ctx, t, blood, front) {

          const at = this.def.armorAt + (G.diff === 0 ? 2 : G.diff === 2 ? -1 : 0);
          if (!this.human && this.def.moves && G.fighting && this.taken >= at) { this.taken = 0; this.attack(Math.random() < 0.6 ? 'hit' : 'kick', true); this.armor = true; }
          else this.set('idle', this.def.idle[0], 8);
        }
        break;
      case 'parry': if (this.t > 0.22) this.set('idle', this.def.idle[0], 8); break;
      case 'launch': this.pose.rot += dt * -260 * (this.ko ? 1.2 : 1); this.target = 'launch'; this.speed = 6; break;
      case 'down': if (!this.ko && this.t > 0.55) this.set('getup', 'getUp', 6); break;
      case 'getup': if (this.t > 0.35) this.set('idle', this.def.idle[0], 6); break;
      case 'dizzy': { const w = Math.sin(G.time * 3); this.target = 'dizzy'; this.speed = 4; this.pose.lean += w * 0.25; this.pose.head += w * 0.5; break; }
      case 'wheel': {
        const k = Math.min(1, this.t / 0.62);
        this.pose.rot = 360 * k; this.target = 'wheel'; this.speed = 16;
        if (k > 0.45 && !this.hitDone) G.tryHit(this, foe, this.def.moves.wheel);
        if (k >= 1) { this.pose.rot = 0; this.vx = 0; this.set('idle', this.def.idle[0], 10); }
        break;
      }
      case 'flip': this.pose.rot -= dt * 900; if (this.grounded) { this.pose.rot = 0; this.set('idle', this.def.idle[0], 10); } break;
    }
    // physics
    if (!this.grounded) {
      this.vy += 2200 * dt; this.y += this.vy * dt; this.x += this.vx * dt;
      if (this.y >= 0) {
        this.y = 0; this.vy = 0; this.grounded = true;
        if (this.state === 'launch') { this.set('down', 'down', 12); this.pose.rot = -88; this.vx *= 0.3; Audio.sfx('fall'); FX.dust(this.x, Stages.GROUND, 14); FX.shake = Math.max(FX.shake, 8); }
        else if (this.state === 'jump' || this.state === 'jumpKick') { this.set('idle', this.def.idle[0], 12); this.vx = 0; Audio.sfx('land'); FX.dust(this.x, Stages.GROUND, 5); }
        else if (this.state === 'thrown') { this.set('down', 'down', 12); }
      }
    } else {
      this.x += this.vx * dt;
      if (!['walk', 'block', 'dash', 'wheel'].includes(this.state) || (this.state === 'dash' && this.t >= 0.42)) this.vx *= Math.exp(-9 * dt);
    }
    if (this.state === 'down' && !this.scripted) this.pose.rot += (-88 - this.pose.rot) * Math.min(1, dt * 12);
    const tgt = P[this.target] || P.idle;
    Rig.lerpPose(this.pose, tgt, Math.min(1, dt * this.speed), this.state === 'launch' || this.state === 'flip' || this.state === 'wheel' || this.state === 'down' || this.freeRot);
  }

  /* -------------------------------------------------------- render */
  solve() { this.J = Rig.solve(this, Stages.GROUND); return this.J; }
  draw(ctx, stage, dt, opts) { Retro.wrap(ctx, c => this.drawRaw(c, stage, dt, opts)); }
  drawRaw(ctx, stage, dt, opts) {
    const J = this.solve();
    opts = Object.assign({ rim: stage.rim, light: stage.light }, opts || {});
    // ground shadow
    const sh = Math.max(0.3, 1 + this.y / 300);
    if (!(Retro.active && Retro.mode === 'blocks')) { ctx.fillStyle = stage.shadow; ctx.beginPath(); ctx.ellipse(this.x, Stages.GROUND + 3, 62 * this.s * sh, 9 * sh, 0, 0, 7); ctx.fill(); }
    for (const R of this.ropes) {
      const a = R.at === 'head' ? Rig.headAnchor(J) : Rig.beltAnchor(J);
      R.r.update(a, dt, -this.face * 0.9 + (stage.wind || 0) - this.vx / 400, this.face);
    }
    if (opts.noHead) for (const R of this.ropes) if (R.at === 'head') R.r.reset();
    for (const R of this.ropes) if (R.at !== 'head' || !opts.noHead) if (R.at === 'belt' && !this.look.shadow) {} else R.r.draw(ctx);
    if (this.look.shadow) {
      ctx.save(); ctx.shadowColor = 'rgba(130,200,255,0.9)'; ctx.shadowBlur = 22 + 8 * Math.sin(performance.now() / 200);
      Rig.draw(ctx, J, opts); ctx.restore();
      if (Math.random() < 0.5) FX.smoke(J.H[0] + (Math.random() - 0.5) * 50, J.H[1] + Math.random() * 60, 'rgba(20,26,50,0.5)');
    } else Rig.draw(ctx, J, opts);
    for (const R of this.ropes) if (R.at === 'belt' && !this.look.shadow) R.r.draw(ctx);
    // steel smear behind a swinging blade
    if (J.blade && this.look.weapon === 'katana') {
      this.trail.push(J.blade[1]); if (this.trail.length > 6) this.trail.shift();
      const swinging = ['attack', 'dash', 'script'].includes(this.state);
      if (swinging && this.trail.length > 2) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.beginPath(); ctx.moveTo(J.blade[0][0], J.blade[0][1]);
        for (const p of this.trail) ctx.lineTo(p[0], p[1]);
        ctx.closePath(); ctx.fillStyle = 'rgba(190,215,255,0.28)'; ctx.fill(); ctx.restore();
      }
    } else if (J.blade && this.look.weapon === 'staff' && this.state === 'attack' && this.t > this.move.st - 0.05 && this.t < this.move.st + this.move.act + 0.05) {
      this.trail.push(J.blade[1]); if (this.trail.length > 5) this.trail.shift();
      ctx.save(); ctx.strokeStyle = 'rgba(255,240,210,0.35)'; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.beginPath();
      this.trail.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); ctx.restore();
    } else this.trail.length = 0;
  }
}

/* ------------------------------------------------------------ helpers */
function text(s, x, y, size, col, opts) {
  opts = opts || {};
  ctx.save();
  ctx.font = `${opts.weight || 700} ${size}px ${opts.font || FONT.hud}`; ctx.textAlign = opts.align || 'center'; ctx.textBaseline = 'middle';
  if (opts.spacing) ctx.letterSpacing = opts.spacing + 'px';
  if (opts.glow) { ctx.shadowColor = opts.glow; ctx.shadowBlur = opts.blur || 18; }
  if (opts.stroke) { ctx.lineWidth = opts.stroke; ctx.strokeStyle = opts.strokeCol || '#000'; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
  ctx.restore();
}
function wrap(s, max, size, font) {
  ctx.save(); ctx.font = `${size}px ${font}`;
  const out = []; let line = '';
  for (const w of s.split(' ')) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > max && line) { out.push(line); line = w; } else line = t; }
  if (line) out.push(line); ctx.restore(); return out;
}
function go(scene, arg) { G.scene = scene; Input.clear(); if (scene.enter) scene.enter(arg); }
const ease = t => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);

// tap targets for menus, in game coordinates
let hits = [];
function button(label, x, y, w, h, on, sel) {
  hits.push({ x: x - w / 2, y: y - h / 2, w, h, on });
  ctx.save();
  if (sel) { ctx.fillStyle = 'rgba(163,32,29,0.85)'; ctx.fillRect(x - w / 2, y - h / 2, w, h); ctx.strokeStyle = '#ffcf7a'; ctx.lineWidth = 2; ctx.strokeRect(x - w / 2 + 1, y - h / 2 + 1, w - 2, h - 2); }
  else { ctx.fillStyle = 'rgba(10,6,6,0.6)'; ctx.fillRect(x - w / 2, y - h / 2, w, h); ctx.strokeStyle = 'rgba(201,162,75,0.5)'; ctx.lineWidth = 1; ctx.strokeRect(x - w / 2 + 0.5, y - h / 2 + 0.5, w - 1, h - 1); }
  ctx.restore();
  text(label, x, y + 1, 24, sel ? '#fff' : '#d9cfbd', { spacing: 2 });
}
function menuNav(list, sel, evs, onPick) {
  for (const e of evs) {
    if (e.m === 'up' || e.m === 'left') { sel = (sel + list.length - 1) % list.length; Audio.sfx('ui'); }
    if (e.m === 'down' || e.m === 'right') { sel = (sel + 1) % list.length; Audio.sfx('ui'); }
    if (e.m === 'ok' && !e.touch) { Audio.sfx('confirm'); onPick(sel); }
    if (e.m === 'tap') for (const h of hits) if (e.x >= h.x && e.x <= h.x + h.w && e.y >= h.y && e.y <= h.y + h.h) { Audio.sfx('confirm'); h.on(); }
  }
  return sel;
}

const LOGO = [
  '██▓▓▒▒░░ ██▓▒',
  '█▓▒       █▓▒',
  '█▓▒       █▓▒                                   (R)',

  '     █▓▒                    ▓▒░',
  '     █▓▒                 ██▓▒▒░',
  '██▓▓▒▒░░',
];
function drawLogo(x, y, cell, t, alpha) {
  // each 1996 shade glyph becomes a cell of light: █ solid, ▓ ▒ ░ fading out
  const dens = { '█': 1, '▓': 0.72, '▒': 0.46, '░': 0.22 };
  ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha;
  const cw = cell * 0.6, ch = cell;
  for (let r = 0; r < LOGO.length; r++) for (let c = 0; c < LOGO[r].length; c++) {
    const k = dens[LOGO[r][c]]; if (!k) continue;
    const px = x + c * cw, py = y + r * ch;
    const shine = Math.max(0, 1 - Math.abs(((t * 300) % 1600) - 300 - (px - x)) / 70);
    ctx.fillStyle = `rgba(${85 + shine * 170 | 0},255,255,${k})`;
    ctx.shadowColor = 'rgba(85,255,255,0.8)'; ctx.shadowBlur = 10 * k;
    ctx.fillRect(px, py, cw - 1, ch - 1);
  }
  ctx.restore();
  text('(R)', x + 48.6 * cw, y + 2.5 * ch, cell * 0.9, '#55ffff', { font: FONT.dos, weight: 400 });
}

/* ===================================================================== FIGHT */
function startStage(n) {
  G.stageIdx = n;
  setupFight(G.hero, ENEMIES[n], n, false);
}
function startVersus() {
  setupFight(G.hero, G.hero2, Math.floor(Math.random() * 3), true);
}
function setupFight(a, b, stageN, versus) {
  G.versus = versus; G.stage = Stages.make(stageN); G.stageN = stageN;
  G.p = new Fighter(a, 0, 1, true, 0); G.e = new Fighter(b, 0, -1, versus, 1);
  G.wins = [0, 0]; G.round = 1;
  go(Fight);
}

const Fight = {
  enter() { this.resetRound(); Audio.music(G.stage.music); },
  resetRound() {
    const p = G.p, e = G.e;
    for (const f of [p, e]) { f.hp = 10; f.vx = f.vy = 0; f.y = 0; f.grounded = true; f.ko = false; f.scripted = false; f.freeRot = false; f.set('idle', f.def.idle[0], 8); f.pose = Rig.copy(Rig.POSES[f.def.idle[0]]); f.dmgShow = 10; f.drawOpts = {}; f.punchCount = 0; f.ropes.forEach(r => r.r.reset()); }
    p.x = Stages.ARENA / 2 - 170; e.x = Stages.ARENA / 2 + 170; p.face = 1; e.face = -1;
    G.cam = Stages.ARENA / 2 - W / 2; G.projectiles = []; FX.reset(); G.codeEntry = null; G.fatal = null; G.pit = null;
    G.fighting = false; this.phase = 'round'; this.t = 0; G.slow = 1; G.combo = { n: 0, t: 0 }; this.result = null;
    const rn = ['Round one', 'Round two', 'Round three', 'Round four', 'Round five'][Math.min(4, G.round - 1)];
    if (G.round <= 3) Audio.clip('round' + G.round, rn); else Audio.say(rn);
    Audio.sfx('gong');
  },
  update(dt, evs) {
    if (G.paused) return Pause.update(dt, evs);
    if (evs.some(e => e.m === 'pause')) { G.paused = true; Pause.sel = 0; Audio.duck(0.3, 0.3); return; }
    const realDt = dt;
    if (G.hitstop > 0) { G.hitstop -= dt; dt = 0; }
    dt *= G.slow;
    this.t += realDt; G.ftime = (G.ftime || 0) + dt;
    const p = G.p, e = G.e;
    if (G.stage.update) G.stage.update(dt);
    // round flow
    if (this.phase === 'round' && this.t > 1.3) { this.phase = 'fightcall'; this.t = 0; Audio.clip('fight', 'Fight!', 1, 0.3); Audio.sfx('taiko'); }
    if (this.phase === 'fightcall' && this.t > 0.6) { this.phase = 'fighting'; G.fighting = true; }
    // control
    p.control(G);
    if (G.versus) e.control(G); else { Input.take(1); e.brain(G, p, dt); }
    if (!G.fatal) {
      if (p.canAct() && p.grounded) p.face = e.x > p.x ? 1 : -1;
      if (e.canAct() && e.grounded) e.face = p.x > e.x ? 1 : -1;
    }
    if (dt > 0) {
      p.update(G, dt, e); e.update(G, dt, p);
      this.separate(p, e);
      for (const pr of G.projectiles) this.updateProjectile(pr, dt);
      G.projectiles = G.projectiles.filter(pr => pr.alive);
      FX.update(dt);
      if (G.fatal) G.fatal.update(dt);
    }
    if (G.combo.t > 0) { G.combo.t -= realDt; if (G.combo.t <= 0) G.combo.n = 0; }
    for (const f of [p, e]) f.dmgShow += (f.hp - f.dmgShow) * Math.min(1, realDt * (f.dmgHold > 0 ? 0 : 3)), f.dmgHold = (f.dmgHold || 0) - realDt;
    // camera
    if (!G.pit) {
      const mid = (p.x + e.x) / 2 - W / 2;
      G.cam += (Math.max(0, Math.min(Stages.ARENA - W, mid)) - G.cam) * Math.min(1, realDt * 4);
    }
    if (G.codeEntry) {
      for (const e of evs) if (e.m === 'tap' && G.codeEntry) {
        const row = G.codeRows.find(r => Math.abs(e.y - r.y) < 16 && Math.abs(e.x - W / 2) < 210);
        if (row) { const ce = G.codeEntry; G.codeEntry = null; startFatality(ce.codes[row.code], ce.who, ce.foe); break; }
      }
    }
    if (G.codeEntry) {
      G.codeEntry.t -= realDt;
      if (G.codeEntry.t <= 0) this.finishFail(true);
    }
    if (this.phase === 'ko' || this.phase === 'won') this.koFlow(realDt, evs);
  },
  separate(a, b) {
    if (G.fatal) return;
    const min = 80 * (a.s + b.s) / 2, d = b.x - a.x;
    if (Math.abs(d) < min && Math.abs(a.y - b.y) < 150 && a.state !== 'down' && b.state !== 'down') {
      const push = (min - Math.abs(d)) / 2 * Math.sign(d || 1);
      a.x -= push; b.x += push;
    }
    for (const f of [a, b]) f.x = Math.max(60, Math.min(Stages.ARENA - 60, f.x));
  },
  updateProjectile(pr, dt) {
    pr.t += dt; pr.x += pr.vx * dt;
    const tgt = pr.owner === G.p ? G.e : G.p;
    if (pr.kind === 'fire') { if (Math.random() < 0.9) FX.ember(pr.x - Math.sign(pr.vx) * 14, GY + pr.y + (Math.random() - 0.5) * 16); }
    else for (let i = 0; i < 3; i++) FX.add({ x: pr.x - Math.sign(pr.vx) * Math.random() * 60, y: GY + pr.y + (Math.random() - 0.5) * 90, vx: -pr.vx * 0.2, vy: (Math.random() - 0.5) * 60, life: 0.4, size: 3 + Math.random() * 4, col: Math.random() < 0.5 ? '#dff4ff' : '#7fc8ff', kind: 'spark', drag: 2 });
    if (pr.x < G.cam - 100 || pr.x > G.cam + W + 100) pr.alive = false;
    if (!G.fighting || tgt.state === 'down' || tgt.ko) return;
    const tx = tgt.x, hitR = pr.kind === 'blast' ? 70 : 40;
    if (Math.abs(pr.x - tx) < hitR && tgt.y > -100 + (pr.kind === 'blast' ? -60 : 0)) {
      pr.alive = false;
      this.resolve(pr.owner, tgt, { dmg: pr.dmg, type: 'mid', proj: pr.kind, sfx: pr.kind === 'fire' ? 'explode' : 'blast' }, pr.x, GY + pr.y);
    }
  },
  resolve(att, def, m, hx, hy) {
    // Frill's answers from CSHOGUN.BAS
    if (def.def.frill && !G.versus && G.fighting) {
      if (m.proj === 'fire' || m === MOVES.dash) {
        if (Math.random() < 1 / 3) { FX.ring(hx, hy, '#9fdcff', 60); Audio.sfx('parry'); frillBlast(def); return; }
      }
      if (m === MOVES.upper && Math.random() < 1 / 3) { def.set('parry', 'parry', 30); Audio.sfx('parry'); FX.spark(hx, hy, '#bfe6ff', 16); FX.pop('BLOCKED', hx - G.cam, hy - 40, '#9fdcff', 28); return; }
      if (m === MOVES.jumpKick && Math.random() < 1 / 3) { frillThrow(def, att); return; }
      if (m === att.def.punch) {
        def.punchCount++;
        if (def.punchCount % 3 === 0) {
          def.set('parry', 'parry', 30); Audio.sfx('parry'); FX.spark(hx, hy, '#bfe6ff', 14);
          const r = Math.floor(Math.random() * 4);
          setTimeout(() => { if (G.fighting && def.state === 'parry') { def.set('idle'); if (r === 1 || r === 2) def.attack('hit', true); else if (r === 0) def.attack('kick', true); } }, 160);
          return;
        }
      }
    }
    const blocked = def.state === 'block' && def.grounded;
    if (blocked) {
      Audio.sfx('block'); FX.spark(hx, hy, '#fff6d0', 10); G.hitstop = 0.05; def.vx = -def.face * 160;
      if (m.proj) FX.ring(hx, hy, '#ffd28a', 40);
      return;
    }
    def.hp = Math.max(0, def.hp - m.dmg); def.dmgHold = 0.5;
    Audio.sfx(m.sfx || 'punch'); def.grunt(def.hp <= 0 ? 'ko' : 'hurt');
    const pow = m.dmg / 2;
    FX.blood(hx, hy, -def.face, pow); FX.spark(hx, hy, m.proj === 'blast' ? '#bfe6ff' : '#ffe6b0', 6 + m.dmg * 4);
    if (m.proj === 'fire') FX.ring(hx, hy, '#ffb050', 70);
    G.hitstop = 0.05 + m.dmg * 0.03; FX.shake = Math.max(FX.shake, 3 + m.dmg * 3);
    if (att.human) {
      G.combo.n = G.combo.t > 0 ? G.combo.n + 1 : 1; G.combo.t = 0.9;
      const call = { 3: 'SUPER', 4: 'MASTER', 5: 'SUPERIOR!!!!', 6: 'MASSIVE!!!!!', 8: 'FULL POWER 100% COMBO' }[G.combo.n];
      if (call) { FX.pop(call, att.x < def.x ? 260 : 700, 140, '#ffdd55', 40); Audio.sfx('dizzy'); }
    }
    if (def.hp <= 0) return this.ko(att, def);
    if (!def.human) def.taken = (def.taken || 0) + 1;
    if (def.armor && def.state === 'attack') { FX.ring(hx, hy, '#ffd28a', 34); return; }
    if (m.launch || m.dmg >= 3) { def.set('launch', 'launch', 6); def.grounded = false; def.vy = -620; def.vx = -def.face * 240; }
    else { def.set('hurt', m.type === 'low' ? 'hitLo' : 'hitHi', 30); def.hurtT = 0.22 + m.dmg * 0.06; def.vx = -def.face * (150 + m.dmg * 50); def.pose.rot = 0; }
    if (def.def.acrobat && !def.human && Math.random() < 0.25) setTimeout(() => { if (def.state === 'idle' && G.fighting) { def.set('flip', 'jump', 12); def.grounded = false; def.vy = -700; def.vx = -def.face * 260; } }, 350);
  },
  ko(att, def) {
    G.fighting = false; G.projectiles = [];
    const pWon = def === G.e, wi = pWon ? 0 : 1;
    const deciding = G.wins[wi] === 1;
    // double KO: the 1996 Frill fight called a draw and replayed the round
    if (att.hp <= 0) { this.phase = 'ko'; this.t = 0; this.result = { draw: true }; def.ko = true; def.set('launch', 'launch', 6); def.grounded = false; def.vy = -500; return; }
    G.slow = 0.25; FX.flash = 0.6; FX.flashCol = '#fff';
    if (deciding && (pWon || G.versus)) {
      // FINISH HIM: the loser stays up, dazed
      def.hp = 0; def.set('dizzy', 'dizzy', 4); def.vx = -def.face * 260;
      this.phase = 'finish'; this.t = 0; G.wins[wi]++;
      setTimeout(() => { G.slow = 1; this.banner("GRANT A WARRIOR'S MERCY", '#ff3b2f', 2.6); Audio.clip('mercy', "Grant a warrior's mercy", 0.9, 0.1); Audio.sfx('dizzy');
        const codes = CODES[att.key][G.versus ? 0 : G.stageIdx];
        const secs = isTouch() ? 11 : 8;
        G.codeEntry = { who: att, foe: def, codes, d: '', t: secs, max: secs }; att.set('idle', att.def.idle[0], 8); att.vx = 0; att.digits = []; Input.take(att.pad); }, 700);
      return;
    }
    def.ko = true; def.set('launch', 'launch', 6); def.grounded = false; def.vy = -560; def.vx = -def.face * 300;
    G.wins[wi]++; this.phase = 'ko'; this.t = 0; this.result = { winner: att, loser: def, final: G.wins[wi] >= 2 };
    Audio.sfx('heavy'); FX.blood(def.x, GY - 150, -def.face, 1.5);
  },
  banner(s, col, dur, sub) { G.banner = { s, col, t: 0, dur: dur || 1.4, sub }; },
  koFlow(dt, evs) {
    const r = this.result; if (!r) return;
    if (this.t > 0.9) G.slow = 1;
    if (!r.shown && this.t > 1.1) {
      r.shown = true;
      if (r.draw) { this.banner('DRAW', '#ebe3d3', 1.6); }
      else if (r.winner === G.p && !G.versus) this.banner('YOU WIN!', '#ffdd55', 2, winSub(r.winner));

      r.next = true;
      if (r.draw) { this.resetRound(); return; }
      if (!r.final) { G.round++; this.resetRound(); return; }
      endMatch(r.winner === G.p);
    }
  },
  finishFail(timeout) {
    const ce = G.codeEntry; if (!ce) return; G.codeEntry = null;
    const att = ce.who, def = ce.foe;
    if (timeout) { def.ko = true; def.set('launch', 'kneel', 4); def.grounded = false; def.vy = -50; def.vx = 0; Audio.sfx('fall'); }
    else {
      // a plain finishing blow
      att.move = att.def.upper; att.movePoses = att.def.upperP; att.set('attack', att.def.upperP[0], 30);
      setTimeout(() => { def.ko = true; def.set('launch', 'launch', 6); def.grounded = false; def.vy = -700; def.vx = -def.face * 340; Audio.sfx('heavy'); FX.blood(def.x, GY - 160, -def.face, 2); G.hitstop = 0.12; FX.shake = 10; }, 140);
    }
    this.phase = 'won'; this.t = 0; this.result = { winner: att, loser: def, final: true };
  },
  draw() {
    const p = G.p, e = G.e, st = G.stage;
    ctx.save();
    if (FX.shake > 0) ctx.translate((Math.random() - 0.5) * FX.shake, (Math.random() - 0.5) * FX.shake);
    if (G.pit) { this.drawPit(); }
    else {
      Retro.wrap(ctx, c => st.back(c, G.cam, G.time), true);
      ctx.save(); ctx.translate(-G.cam, 0);
      FX.drawDecals(ctx, st.bloodFloor);
      if (G.fatal && G.fatal.dim) { ctx.fillStyle = `rgba(0,0,0,${G.fatal.dim * 0.55})`; ctx.fillRect(G.cam, 0, W, H); }

function drawBar(x, y, w, h, hp, show, flip) {
  ctx.save();

  ctx.strokeStyle = '#c9a24b'; ctx.lineWidth = 2; ctx.strokeRect(x - 3, y - 3, w + 6, h + 6);
  ctx.fillStyle = '#2a0b0a'; ctx.fillRect(x, y, w, h);
  const k = hp / 10, ks = Math.max(k, show / 10);
  const fill = (kk, col) => { const ww = w * kk; if (flip) ctx.fillRect(x + w - ww, y, ww, h); else ctx.fillRect(x, y, ww, h); };
  ctx.fillStyle = '#f2e6c8'; fill(ks);
  const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#ff5a3c'); g.addColorStop(0.5, '#c4221a'); g.addColorStop(1, '#7a0f0b');

}

/* ================================================================ FATALITIES */
function startFatality(kind, att, def) {
  G.found[kind] = 1; store.set('found', G.found);
  Fight.phase = 'fatal'; G.fighting = false;
  const steps = { head: fatalHead, pit: fatalPit, throw: fatalPit, run: fatalRun }[kind];
  G.fatal = { t: 0, dim: 0, kind, done: {}, att, def, run: steps };
  att.scripted = true; def.scripted = true;
  Audio.duck(0.25, 6);
  G.fatal.update = function (dt) {
    this.t += dt; this.dim = Math.min(1, this.dim + dt * 2);
    const once = (k, at, fn) => { if (this.t >= at && !this.done[k]) { this.done[k] = 1; fn(); } };
    this.run(this, once, dt);
    once('banner', this.bannerAt || 99, () => { Fight.banner('KAISHAKU!', '#ff2a1f', 2.6); Audio.sfx('fatality'); Audio.clip('kaishaku', 'Kye-shah-koo!', 0.75, 0.05); FX.flash = 0.5; FX.flashCol = '#a00'; });
    once('wins', (this.bannerAt || 99) + 2.8, () => { Fight.banner(`${NAMES[att.key]} WINS`, '#ffdd55', 2.2, FATAL_NAMES[kind] + (att.hp >= 10 ? ' · IMPECCABLE' : '')); winCall(att); });
    once('end', (this.bannerAt || 99) + 5.2, () => { G.fatal = null; G.pit = null; endMatch(att === G.p); });
  };
}
// a blade's crescent of light; face flips it so the swing always follows the attacker's facing
function slashArc(x, y, r, a0, a1, face) {

  FX.add({ kind: 'slash', x, y, size: r, a0, a1, life: 0.35, g: 0 });
}
// the announcer at a win: Chris's recorded lines, and IMPECCABLE when the winner took no damage
function winSub(w) { return w.hp >= 10 ? 'IMPECCABLE' : undefined; }
function winCall(w) {
  if (G.versus) Audio.clip('n_' + w.key, NAMES[w.key].replace('Ō', 'O').replace("'", '') + ' wins');
  else if (w === G.p) Audio.clip('youwin', 'You win');
  else Audio.clip('youlose', 'You lose');
  if (w.hp >= 10) setTimeout(() => Audio.clip('impeccable', 'Impeccable'), 1500);
}
function approach(f, x, dt, sp) { const d = x - f.x; if (Math.abs(d) > 4) { f.x += Math.sign(d) * Math.min(Math.abs(d), sp * dt); f.target = Math.sin(G.time * 9) > 0 ? 'walk1' : 'walk2'; f.speed = 10; return false; } return true; }

function fatalHead(F, once, dt) {

  once('wind', 0.72, () => { a.target = 'slashS'; a.speed = 10; Audio.sfx('whoosh'); });
  once('swing', 1.08, () => { a.state = 'script'; a.target = 'slashH'; a.speed = 46; Audio.sfx('slash'); });
  if (t > 1.08 && t < 1.2) a.x += a.face * 380 * dt;

    Audio.sfx('sliceHit'); Audio.sfx('crunch'); Audio.sfx('blood');
    const J = d.solve(); d.drawOpts = { noHead: true };

    FX.gibs.push(new FX.Gib(J, 'head', J.Hd, a.face * 160, -1050, a.face * 9, { restOff: 14 }));
    FX.shake = 16; G.hitstop = 0.15; FX.flash = 0.35; FX.flashCol = '#900';
  });
  if (t > 1.15 && t < 3.0 && d.J) { const n = d.J.N; FX.bloodJet(n[0], n[1] - 4, -Math.PI / 2 + Math.sin(t * 8) * 0.3, 520, 2); }
  once('hold', 1.5, () => { a.state = 'fatal'; });
  once('sag', 2.4, () => { d.target = 'kneel'; d.speed = 5; Audio.sfx('fall'); });
  once('drop', 3.1, () => { d.target = 'down'; d.speed = 7; d.freeRot = false; d.vx = -d.face * 260; Audio.sfx('fall'); FX.dust(d.x, GY, 12); });
  if (t > 3.1) d.pose.rot += (-88 - d.pose.rot) * Math.min(1, dt * 7);

  if (t < 0.7) { if (approach(a, d.x - a.face * (thrown ? 40 : 80), dt, 220)) a.target = a.def.idle[0]; }
  if (thrown) {
    once('grab', 0.75, () => { a.target = 'grab'; a.speed = 16; Audio.sfx('catch'); });
    once('lift', 1.1, () => { a.target = 'carry'; a.speed = 9; d.freeRot = true; d.target = 'heldUp'; d.speed = 8; d.grounded = true; });
    if (t > 1.1 && t < 1.8) { d.x += (a.x - d.x) * Math.min(1, dt * 8); d.y += (-190 - d.y) * Math.min(1, dt * 8); d.pose.rot += (-90 - d.pose.rot) * Math.min(1, dt * 8); }
    once('toss', 1.8, () => { Audio.sfx('whoosh'); d.state = 'launch'; d.grounded = false; d.vy = -1700; d.vx = a.face * 60; });
  } else {
    once('crouch', 0.72, () => { a.target = a.def.upperP[0]; a.speed = 14; Audio.sfx('whoosh'); });
    once('up', 1.05, () => { a.state = 'script'; a.target = a.def.upperP[1]; a.speed = 44; a.x += a.face * 20; Audio.sfx('heavy');
      slashArc(a.x + a.face * 40, GY - 150, 110, 1.3, -1.2, a.face); FX.blood(d.x, GY - 160, a.face, 1.5); FX.shake = 12; G.hitstop = 0.1; d.state = 'launch'; d.grounded = false; d.vy = -1800; d.vx = a.face * 40; d.freeRot = true; });
  }
  if (d.state === 'launch' && !G.pit) d.pose.rot -= dt * 500;
  once('cut', thrown ? 2.35 : 1.6, () => {
    // cut to the pit below the arena floor
    G.pit = { blood: 0 }; G.cam = 0; d.x = W / 2; d.y = -900; d.vy = 300; d.vx = 0; d.grounded = true; d.state = 'pitfall'; d.target = 'impaled'; d.speed = 4; d.freeRot = true; d.pose.rot = -60;
    FX.parts.length = 0; FX.decals.length = 0;
  });
  if (G.pit && !F.done.impale) {
    d.vy += 2200 * dt; d.y += d.vy * dt; d.pose.rot += (-84 - d.pose.rot) * Math.min(1, dt * 5);
    if (d.y >= -70) {
      d.y = -70; d.vy = 0; F.done.impale = 1;
      Audio.sfx('spikes'); Audio.sfx('blood'); FX.shake = 22; FX.flash = 0.5; FX.flashCol = '#800';
      for (let i = 0; i < 4; i++) FX.bloodJet(W / 2 - 60 + i * 40, GY - 90, -Math.PI / 2 + (Math.random() - 0.5), 420, 14);
      F.impaleT = t;
    }
  }
  if (G.pit) {
    G.pit.blood = Math.min(1, G.pit.blood + (F.done.impale ? dt * 0.8 : 0));
    if (F.done.impale && Math.random() < 0.3) FX.add({ x: W / 2 - 80 + Math.random() * 160, y: GY - 60, vy: 40, g: 900, life: 0.6, size: 2 + Math.random() * 2, col: '#7a0c0a', kind: 'blood' });
  }
  F.bannerAt = thrown ? 3.4 : 2.8;
}
// the pit uses the fighter's own physics off, so keep its grounded flag false while falling
function fatalRun(F, once, dt) {
  const a = F.att, d = F.def, t = F.t;
  if (t < 0.55) { if (approach(a, d.x - a.face * 150, dt, 260)) a.target = a.def.idle[0]; }
  once('lunge', 0.6, () => { a.state = 'script'; a.target = 'thrust'; a.speed = 30; Audio.sfx('dash'); });
  if (t > 0.6 && t < 0.78) a.x += a.face * 470 * dt;
  once('pierce', 0.78, () => {
    Audio.sfx('sliceHit'); Audio.sfx('blood'); d.target = 'hitLo'; d.speed = 20; G.hitstop = 0.18; FX.shake = 12;
    a.drawOpts = { bloodBlade: true };
  });
  if (t > 0.8 && t < 1.7 && d.J) FX.bloodJet(d.x + a.face * 26, GY - 140 * d.s, a.face > 0 ? -0.3 : Math.PI + 0.3, 380, 2);
  once('pull', 1.7, () => { a.state = 'fatal'; a.target = 'sIdle'; a.speed = 8; d.target = 'hitHi'; d.speed = 8; Audio.sfx('slash'); });
  if (t > 1.7 && t < 2.1) a.x -= a.face * 220 * dt;
  once('raise', 2.15, () => { a.target = 'cleaveS'; a.speed = 12; Audio.sfx('whoosh'); });
  once('cleave', 2.55, () => {
    a.state = 'script'; a.target = 'cleaveH'; a.speed = 46; slashArc(a.x, GY - 200, 150, -1.9, 0.4, a.face); Audio.sfx('slash'); Audio.sfx('crunch'); Audio.sfx('blood');
    const J = d.solve(); d.drawOpts = { only: 'lower' };
    FX.gibs.push(new FX.Gib(J, 'upper', J.H, a.face * 210, -620, a.face * 3.2, { restOff: 34, rim: G.stage.rim, light: G.stage.light }));
    FX.shake = 18; G.hitstop = 0.16; FX.flash = 0.4; FX.flashCol = '#900';
  });
  if (t > 2.55 && t < 4 && d.J) FX.bloodJet(d.J.H[0], d.J.H[1] - 6, -Math.PI / 2 + Math.sin(t * 9) * 0.35, 460, 2);
  once('legs', 3.2, () => { d.target = 'kneel'; d.speed = 5; Audio.sfx('fall'); });
  once('vict', 3.5, () => { a.state = 'fatal'; a.target = 'sVictory'; a.speed = 5; });
  F.bannerAt = 3.6;
}

/* ================================================================ LOOP */
let last = performance.now(), q = 1;
function resize() {
  const r = cv.getBoundingClientRect();
  q = Math.min(2.5, Math.max(1, (window.devicePixelRatio || 1) * r.width / W));
  cv.width = Math.round(W * q); cv.height = Math.round(H * q);
}
addEventListener('resize', resize);
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  Input.menu.push({ m: 'tap', x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H });
  if (e.pointerType === 'touch') { Input.touch = true; document.body.classList.add('touch'); }
});
addEventListener('touchstart', () => { Input.touch = true; document.body.classList.add('touch'); }, { passive: true });

// phones: go full screen on the first tap (browsers only allow it from a tap)
// opened from the collection menu: the menu page holds full screen and takes us back
const inMenu = (() => { try { return parent !== window && parent.location.origin === location.origin; } catch (e) { return false; } })();
function goFull() {
  if (inMenu) { parent.postMessage('shogun:full', location.origin); return; }
  const d = document.documentElement, fs = d.requestFullscreen || d.webkitRequestFullscreen;
  if (!matchMedia('(pointer: coarse)').matches || !fs || document.fullscreenElement || document.webkitFullscreenElement) return;
  try { const r = fs.call(d); if (r && r.catch) r.catch(() => {}); } catch (e) {}
}
addEventListener('pointerdown', goFull, { once: true, capture: true });

// back to the Shogun Classics menu (the folder above this game)
function toMenu(e) {
  if (e && e.preventDefault) e.preventDefault();
  if (inMenu) { parent.postMessage('shogun:menu', location.origin); return; }
  let same = false;
  try { same = !!document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1; } catch (err) {}
  if (same) history.back(); else location.href = '../';
}
document.getElementById('btnMenu').addEventListener('click', toMenu);

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  G.time += dt; G.frameDt = dt;
  Input.pollPads();
  document.body.classList.toggle('two', Input.twoP);
  Input.fourWay = !!G.codeEntry;   // during FINISH HIM the stick reads only up, down, left and right
  document.body.classList.toggle('front', G.scene === Title || G.scene === Power);   // corner MENU link only on the title screens
  const evs = Input.takeMenu();
  try {
    G.scene.update(dt, evs);
    ctx.setTransform(q, 0, 0, q, 0, 0);
    G.scene.draw();
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
Input.bindTouch(document.getElementById('touch'));
if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
resize(); go(Power); requestAnimationFrame(frame);

</script>
