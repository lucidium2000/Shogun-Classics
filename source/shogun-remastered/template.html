<title>Shogun Remastered</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Shippori+Mincho+B1:wght@800&family=VT323&display=swap">
<style>
:root { --bg: #050303; --panel: #0d0807; --line: #3a1a14; --accent: #a3201d; --brass: #c9a24b; --fg: #ebe3d3; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); box-sizing: border-box; }
#screen { position: relative; width: min(100%, calc((100vh - 0px) * 16 / 9)); width: min(100%, calc(100dvh * 16 / 9)); aspect-ratio: 16 / 9; max-width: 100%; }
#cv { display: block; width: 100%; height: 100%; background: #000; outline: none; image-rendering: auto; }
#touch { display: none; }
body.touch #touch { display: flex; }
.pad { position: relative; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.06), rgba(255,255,255,0.02) 60%, rgba(0,0,0,0.25)); border: 2px solid rgba(201,162,75,0.45); touch-action: none; flex: none; }
.pad::before, .pad::after { content: ""; position: absolute; background: rgba(201,162,75,0.18); }
.pad::before { left: 50%; top: 14%; bottom: 14%; width: 2px; margin-left: -1px; }
.pad::after { top: 50%; left: 14%; right: 14%; height: 2px; margin-top: -1px; }
#knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #5a4a3a, #1a1210); border: 2px solid rgba(201,162,75,0.7); pointer-events: none; z-index: 1; }
.btns { display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; gap: 12px; align-items: center; flex: none; }
.b { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font: 700 26px/1 'Barlow Condensed', 'Arial Narrow', sans-serif; letter-spacing: 1px; color: #fff; touch-action: none; border: 2px solid rgba(255,255,255,0.35); }
#btnP { background: radial-gradient(circle at 40% 35%, #d9322b, #7a0f0b); grid-row: 1 / 3; grid-column: 2; width: 98px; height: 98px; font-size: 30px; }
#btnSP { background: radial-gradient(circle at 40% 35%, #e8a33a, #7a4b0b); width: 64px; height: 64px; font-size: 20px; }
#btnPause { background: rgba(255,255,255,0.08); width: 46px; height: 46px; font-size: 16px; border-color: rgba(255,255,255,0.2); }
.b.on { filter: brightness(1.5); transform: scale(0.95); }
/* portrait phone: controls live under the screen */
@media (orientation: portrait) {
  body.touch #app { justify-content: flex-start; padding-top: max(10px, env(safe-area-inset-top, 0px)); }
  body.touch #screen { width: 100%; }
  body.touch #touch { width: 100%; flex: 1; align-items: flex-end; flex-wrap: wrap; align-content: space-between; justify-content: space-between; padding: 12px max(22px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px)); box-sizing: border-box; background: linear-gradient(var(--panel), #000); border-top: 1px solid var(--line); }
}
/* landscape phone: controls float over the screen corners */
@media (orientation: landscape) {
  body.touch #touch { position: fixed; inset: auto 0 0 0; justify-content: space-between; align-items: flex-end; padding: 0 max(18px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); pointer-events: none; opacity: 0.72; }
  body.touch #touch > * { pointer-events: auto; }
  body.touch .pad { width: 130px; height: 130px; }
  body.touch .b { width: 70px; height: 70px; }
  body.touch #btnP { width: 84px; height: 84px; }
  body.touch #btnSP { width: 56px; height: 56px; }
}
  .tip { display: none; }
@media (orientation: portrait) { body.touch .tip { display: block; width: 100%; margin: 6px 0 0; text-align: center; font: 600 15px/1.4 'Barlow Condensed', 'Arial Narrow', sans-serif; letter-spacing: 1px; color: #8c7f6c; } body.touch #touch { padding-bottom: max(40px, env(safe-area-inset-bottom, 0px)); } }
@media (prefers-reduced-motion: reduce) { .b.on { transform: none; } }
</style>
<div id="app">
  <div id="screen"><canvas id="cv" width="960" height="540" tabindex="0" aria-label="Shogun game screen"></canvas></div>
  <div id="touch" aria-label="Touch controls">
    <p class="tip">Hold back to block · down + P uppercut · up + P jump kick · SP special</p>
    <div class="pad" id="dpad"><div id="knob"></div></div>
    <div class="btns">
      <div class="b" id="btnPause" role="button" aria-label="Pause">II</div>
      <div class="b" id="btnP" role="button" aria-label="Punch">P</div>
      <div class="b" id="btnSP" role="button" aria-label="Special move">SP</div>
    </div>
  </div>
</div>
<script>
/*JS*/
</script>
